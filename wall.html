<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>if (!/^(localhost|127\.0\.0\.1|)$/.test(location.hostname) && /[?&]roomapi=/.test(location.search)) { var u = new URL(location.href); u.searchParams.delete('roomapi'); history.replaceState(null, '', u); }</script>
<title>의견판 · 꿈틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
<!-- 의견판만 따로(연수·학급회의, 2026-11-18 1-나): 선생님 페이지 «의견판 열기»로 만든 방(wallOnly)의 판 하나를 띄운다.
     wall.html?room=<6자리>  — 이 브라우저에 그 방 진행 열쇠(science-room:classes)가 있으면 선생님 화면(프로젝터), 없으면 참가자 휴대폰 화면.
     &as=student  선생님 기기에서 참가자 화면으로 보기 · &roomapi=  시험용 워커 주소
     엔진/src/wall.js를 그대로 쓴다: 장(section data-wall) 하나만 있는 1920×1080 판을 화면에 맞춰 줄이고, 수업방 다리(Wall._bind)는 여기서 웹소켓으로 잇는다.
     원본은 엔진/wall.html, 자료실/wall.html은 node 엔진/wallpage.mjs(slides.mjs publishUnit도 부른다)가 deck.css·qrcode·wall.js를 넣어 만든다. -->
<style>
/* 안드로이드 앱 속 웹 보기가 글자를 제멋대로 키우지 않게(2026-10-31 휴대폰에서 반응식이 칸을 뚫고 나옴) */
html, body { -webkit-text-size-adjust: none !important; -moz-text-size-adjust: none !important; text-size-adjust: none !important; }
/* 모눈 실험 노트: 1920×1080 판 위에 왼쪽은 개념 단, 오른쪽은 살아 있는 그림.
   한 가지 종이 화면으로 고정한다(프로젝터용 밝은 판). 물리 색은 교과서 그림 규칙을 따른다. */
:root {
  --paper: #f2f5f3;
  --paper-2: #fbfcf9;
  --grid: #dbe4e2;
  --grid-strong: #c9d5d3;
  --ink: #1d2433;
  --ink-2: #4b566a;
  --ink-3: #7b8597;
  --rule: #c3cecd;
  --accent: #1f5f4a;        /* 칠판 초록: 단추·선택 */
  --accent-soft: #dcebe4;
  --hl: #ffe27a;            /* 형광펜 */
  --stamp: #c8402f;         /* 인주 */
  --n: #d8343f;             /* N극 */
  --s: #2a63c9;             /* S극 */
  --field: #7d4cc4;         /* 자석의 자기장 */
  --current: #e9731a;       /* 유도 전류 */
  --induced: #23935a;       /* 유도 자기장 */
  --copper-f: #9a5a2c;
  --copper-b: #d8ab83;
  --glow: #ffcf5a;

  --f-display: "Hahmlet", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-pen: "Nanum Pen Script", "Apple SD Gothic Neo", "Malgun Gothic", cursive;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

  --t-hero: 136px;
  --t-h2: 68px;
  --t-lead: 40px;
  --t-body: 32px;
  --t-small: 24px;
}

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); }

.reveal { font-family: var(--f-body); font-size: var(--t-body); color: var(--ink); word-break: keep-all; overflow-wrap: break-word; }
.reveal b, .reveal strong { font-weight: 700; }
.reveal .slide-number a { text-decoration: none; color: inherit; }
.reveal .slides { text-align: left; }
.reveal .slides > section { padding: 0; height: 1080px; width: 1920px; box-sizing: border-box; }
.reveal .slide-background { background: var(--paper); }
.reveal ::selection { background: var(--hl); }
.reveal .controls { color: var(--ink); }
.reveal .progress { color: var(--accent); height: 6px; }
.reveal .slide-number { background: transparent; color: var(--ink-3); font-family: var(--f-mono); font-size: 22px; right: 120px; bottom: 34px; }

/* 모눈종이 */
.sheet {
  position: absolute; inset: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 200px 200px, 200px 200px, 40px 40px, 40px 40px;
  background-position: -1px -1px;
}
.sheet::after { /* 왼쪽 여백선 */
  content: ""; position: absolute; top: 0; bottom: 0; left: 96px; width: 2px; background: rgba(200, 64, 47, .28);
}

.frame { position: absolute; inset: 0; padding: 64px 120px 96px 144px; display: flex; flex-direction: column; gap: 28px; }

.masthead { display: flex; flex-direction: column; gap: 4px; font-size: 22px; color: var(--ink-2); letter-spacing: .08em; }
.masthead .brand { font-weight: 700; color: var(--ink); letter-spacing: .18em; white-space: nowrap; }
/* 상표 꿈틀(2026-11-12 «그냥 단원줄 맨 오른쪽에 새싹»): 글자 없이 단원 줄 끝에 새싹만. 학교를 모르면 이름 줄은 숨긴다(.mark, room.js setBrand). 한 파일로 내려받아도 보이게 그림을 글에 넣는다 */
.masthead .brand.mark { display: none; }
.masthead .crumbs::after { content: ""; display: inline-block; width: 40px; height: 40px; margin: -16px 0 -8px 10px; vertical-align: middle; background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22 fill=%22none%22 stroke=%22%231e2433%22 stroke-width=%223.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M29 16l-2 6h13v20H8V22h12l-2-6%22 fill=%22%23facc15%22/%3E%3Cpath d=%22M24 26c-2-3 2-5 0-8s2-4 0-7%22/%3E%3Cpath d=%22M24 11C19 12 15 10 14 6c5-1 9 1 10 5zM24 10c1-5 5-8 11-7-1 5-5 8-11 7z%22 fill=%22%233a9d5d%22 stroke-width=%222.5%22/%3E%3C/svg%3E") center / contain no-repeat; }
.masthead .crumbs { letter-spacing: .02em; }
.masthead .crumbs b { color: var(--ink); font-weight: 600; }

.eyebrow { font-size: var(--t-small); letter-spacing: .14em; color: var(--accent); font-weight: 700; }
.reveal h1, .reveal h2 { font-family: var(--f-display); color: var(--ink); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.reveal h1 { font-size: var(--t-hero); font-weight: 800; line-height: 1.02; }
.reveal h2 { font-size: var(--t-h2); font-weight: 700; line-height: 1.12; }
.reveal p { margin: 0; line-height: 1.5; }

.pen { font-family: var(--f-pen); color: var(--ink-2); line-height: 1.05; }

.footer {
  position: absolute; left: 144px; right: 300px; bottom: 34px; height: 30px;
  display: flex; gap: 28px; align-items: center; font-size: 22px; color: var(--ink-3);
}
.footer b { color: var(--ink-2); font-weight: 600; flex: none; }
.footer > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---------- 1. 표지 ---------- */
#cover .frame { flex-direction: row; gap: 72px; }
#cover .col-text { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 28px; }
#cover h1 { font-size: 112px; }
#cover .hero-pen { font-size: 56px; transform: rotate(-1.2deg); transform-origin: left center; margin-top: -6px; }
#cover .footer { left: 1100px; right: 300px; }
#cover .lesson-chip {
  align-self: flex-start; display: inline-flex; gap: 14px; align-items: baseline;
  border: 2px solid var(--ink); border-radius: 999px; padding: 6px 22px; font-size: 26px; font-weight: 600;
}
#cover .lesson-chip span { font-family: var(--f-mono); font-size: 22px; color: var(--ink-2); font-weight: 500; }
#cover .goals { display: flex; flex-direction: column; gap: 18px; max-width: 980px; }
#cover .goals-label { font-size: var(--t-small); letter-spacing: .14em; font-weight: 700; color: var(--ink-2); }
#cover .goal { display: grid; grid-template-columns: 52px 1fr; gap: 6px; font-size: 30px; line-height: 1.42; }
#cover .goal .no { font-family: var(--f-display); font-weight: 700; color: var(--ink-2); }
#cover .today {
  margin-top: 6px; padding: 20px 28px; background: var(--paper-2); border: 2px solid var(--ink);
  border-radius: 6px; box-shadow: 6px 6px 0 var(--ink); font-size: 32px; line-height: 1.45;
}
#cover .today .tag { display: block; font-size: var(--t-small); letter-spacing: .14em; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.mark { background-image: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); background-repeat: no-repeat; background-size: 0% 100%; }
.mark.on { background-size: 100% 100%; }

#cover .col-fig { flex: 0 0 700px; display: flex; flex-direction: column; gap: 14px; padding-top: 24px; }
.fig-card { position: relative; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.fig-card video { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; }
.fig-card .fig-no { position: absolute; left: 18px; top: 14px; font-size: 22px; font-weight: 700; letter-spacing: .1em; color: var(--ink-2); }
.fig-caption { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.fig-caption .cap { font-size: 24px; color: var(--ink-2); }
.fig-caption .pen { font-size: 44px; color: var(--ink); transform: rotate(-2deg); }

/* ---------- 2. 실험실 ---------- */
#lab .frame { gap: 20px; }
#lab .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
#lab .head .titles { display: flex; flex-direction: column; gap: 6px; }
#lab .head .pen { font-size: 44px; transform: rotate(-1.5deg); padding-bottom: 6px; white-space: nowrap; }
#lab .body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1060px 1fr; gap: 28px; }

.stage { position: relative; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.stage canvas.dragging { cursor: grabbing; }
.stage .legend { position: absolute; left: 18px; top: 14px; display: flex; gap: 18px; font-size: 21px; color: var(--ink-2); pointer-events: none; }
.stage .legend i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 8px; }
.stage .tools { position: absolute; right: 16px; top: 12px; display: flex; gap: 10px; }
.stage .hint { position: absolute; left: 22px; bottom: 16px; font-size: 40px; color: var(--ink); pointer-events: none; transition: opacity .4s; }
.stage .hint.gone { opacity: 0; }

.btn {
  font: 600 24px/1 var(--f-body); color: var(--ink); background: var(--paper-2);
  border: 2px solid var(--ink); border-radius: 999px; padding: 12px 22px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
}
.btn:hover { background: var(--accent-soft); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper-2); }
.btn:focus-visible, .seg button:focus-visible, .option:focus-visible, .flap:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }

.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel-label { font-size: 22px; letter-spacing: .12em; font-weight: 700; color: var(--ink-2); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
.seg button { font: 600 26px/1 var(--f-body); padding: 18px 8px; border: 0; background: var(--paper-2); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper-2); }

.readout { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 18px 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; }
.readout .count { grid-row: span 2; font-family: var(--f-display); font-weight: 800; font-size: 96px; line-height: .9; font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.readout .count small { font-family: var(--f-body); font-size: 28px; font-weight: 600; margin-left: 4px; }
.readout .what { font-size: 23px; color: var(--ink-2); }
.readout .trend { display: inline-flex; align-items: center; gap: 10px; font-size: 27px; font-weight: 700; }
.readout .trend .chip { display: inline-block; min-width: 1.4em; text-align: center; border-radius: 6px; padding: 2px 8px; border: 2px solid var(--ink); font-family: var(--f-mono); }
.readout .verdict { grid-column: 1 / -1; border-top: 2px dashed var(--rule); padding-top: 10px; font-size: 27px; line-height: 1.35; }
.readout .verdict b { color: var(--ink); }

.chart { display: flex; flex-direction: column; gap: 4px; }
.chart .ct { display: flex; justify-content: space-between; font-size: 22px; color: var(--ink-2); }
.chart .ct b { color: var(--ink); font-weight: 600; }
.chart canvas { width: 100%; height: 118px; display: block; background: var(--paper-2); border: 2px solid var(--rule); border-radius: 4px; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 23px; }
.checks li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; color: var(--ink-2); }
.checks li .box { width: 28px; height: 28px; border: 2px solid var(--ink); border-radius: 5px; display: grid; place-items: center; font-weight: 800; color: var(--paper-2); }
.checks li.done { color: var(--ink); }
.checks li.done .box { background: var(--accent); border-color: var(--accent); }
.checks li .res { font-family: var(--f-pen); font-size: 34px; color: var(--ink); white-space: nowrap; }

/* ---------- 3. 덮개 ---------- */
#flap .frame { gap: 26px; }
#flap .body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 900px 1fr; gap: 56px; }
.results { border-collapse: collapse; width: 100%; font-size: 29px; }
.results th { text-align: left; font-size: 22px; letter-spacing: .12em; color: var(--ink-2); font-weight: 700; padding: 0 0 12px; border-bottom: 3px solid var(--ink); }
.results td { padding: 18px 0; border-bottom: 2px solid var(--rule); vertical-align: middle; line-height: 1.35; }
.results td.sit { padding-right: 18px; }
.results td.sit .si { display: flex; gap: 18px; align-items: center; }
.results td.sit svg { flex: 0 0 64px; }
.results td.out { width: 260px; font-family: var(--f-pen); font-size: 46px; color: var(--ink); }
.results td.out .ans { display: inline-block; }
.results td.out .ans.no { color: var(--ink-2); }
.results tr.more td { border-bottom: 0; }
.results tr.more .tag { display: inline-block; font-family: var(--f-body); font-size: 20px; font-weight: 700; letter-spacing: .1em; color: var(--accent); border: 2px solid var(--accent); border-radius: 999px; padding: 2px 12px; margin-right: 10px; vertical-align: 3px; }
.fragment.custom:not(.visible) .ans { visibility: hidden; }

.predict { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.predict .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.options { display: flex; flex-direction: column; gap: 12px; }
.option {
  text-align: left; font: 500 28px/1.38 var(--f-body); color: var(--ink); background: var(--paper-2);
  border: 2px solid var(--ink); border-radius: 8px; padding: 14px 18px; cursor: pointer;
  display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center;
}
.option .key { font-family: var(--f-display); font-weight: 700; font-size: 32px; color: var(--ink-2); }
.option[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
.option.right { background: #e3f1e8; border-color: var(--induced); box-shadow: inset 0 0 0 2px var(--induced); }
.option .tally { display: none; align-items: center; gap: 8px; font: 600 24px/1 var(--f-mono); }
.option .tally span { min-width: 2ch; text-align: center; }
.option .tally .tb { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper-2); font: 700 24px/1 var(--f-body); cursor: pointer; color: var(--ink); }
.predict.tallying .option .tally { display: inline-flex; }
.option .bar { grid-column: 2 / -1; height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; display: none; }
.option .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.predict.tallying .option .bar { display: block; }

.flap-wrap { position: relative; perspective: 1600px; margin-top: 6px; }
div.answer {
  background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 24px 28px; min-height: 236px;
  display: flex; flex-direction: column; gap: 10px; font-size: 31px; line-height: 1.45;
}
div.answer .tag { font-size: 22px; letter-spacing: .14em; font-weight: 700; color: var(--accent); }
div.answer .small { font-size: 26px; color: var(--ink-2); }
div.answer .note { font-family: var(--f-pen); font-size: 38px; color: var(--ink); min-height: 1em; }
.flap {
  position: absolute; inset: 0; transform-origin: 50% 0; border-radius: 8px; cursor: pointer;
  background:
    repeating-linear-gradient(135deg, rgba(29, 36, 51, .05) 0 2px, transparent 2px 14px),
    #e9e3d4;
  border: 2px solid var(--ink); box-shadow: 0 10px 0 -4px rgba(29, 36, 51, .25);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
  font-family: var(--f-pen); font-size: 54px; color: var(--ink); backface-visibility: hidden;
}
.flap small { font-family: var(--f-body); font-size: 22px; letter-spacing: .1em; color: var(--ink-2); }
.flap::after { /* 접힌 모서리 */
  content: ""; position: absolute; right: -2px; bottom: -2px; width: 54px; height: 54px;
  background: linear-gradient(135deg, #d6cdb8 0 50%, var(--paper) 50%); border-top-left-radius: 6px;
}
.stamp {
  position: absolute; right: 20px; top: -54px; width: 150px; height: 150px; pointer-events: none; opacity: 0;
  color: var(--stamp); transform: rotate(-14deg);
}

/* ---------- 도구 모음 ---------- */
/* 공책 왼쪽 여백(빨간 줄 바깥)에 세로로 둔다. 판서 색상표는 왼쪽 가운데에 뜨므로 위쪽에 붙인다 */
.toolbar {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: max(18px, env(safe-area-inset-top, 0px));
  z-index: 40; display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 999px;
  background: rgba(251, 252, 249, .86); border: 1.5px solid var(--rule); opacity: .55; transition: opacity .2s;
}
.toolbar:hover, .toolbar:focus-within { opacity: 1; }
.toolbar button {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
}
.toolbar button:hover { background: var(--accent-soft); }
.toolbar button[aria-pressed="true"] { background: var(--accent); color: var(--paper-2); }
.toolbar button:focus-visible { outline: 3px solid var(--accent); }
.toolbar svg { width: 22px; height: 22px; }
/* 공개판에만 있는 «자료실 첫 화면» 단추: 다른 도구와 줄로 나눈다 */
.toolbar a.home { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); text-decoration: none; position: relative; margin-bottom: 7px; }
.toolbar a.home::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -7px; height: 1.5px; background: var(--rule); }
.toolbar a.home:hover { background: var(--accent-soft); }
.toolbar a.home:focus-visible { outline: 3px solid var(--accent); }

/* 판서 플러그인: 폰트어썸 없이 쓰기 */
div.palette, div.boardhandle { background: var(--ink); border-color: var(--ink); }
div.palette i.fa-square::before, div.palette i.fa.fa-square::before { content: ""; display: inline-block; width: 30px; height: 30px; border-radius: 7px; background: currentColor; }
div.boardhandle i.fa-chevron-up::before { content: "▲"; color: var(--paper-2); }
div.boardhandle i.fa-chevron-down::before { content: "▼"; color: var(--paper-2); }

/* 휴대폰 세로(reveal 스크롤 보기): 도구 막대를 아래쪽 가로줄로 옮겨 슬라이드를 가리지 않게, 가로로 돌리라는 안내를 잠깐 */
@media (max-width: 600px) and (orientation: portrait) {
  .toolbar { left: 50%; top: auto; bottom: max(10px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); flex-direction: row; gap: 2px; padding: 4px; opacity: .92; }
  .toolbar a.home { margin: 0 7px 0 0; }
  .reveal .controls { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .reveal .slide-number { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); right: 110px; }
  .toolbar a.home::after { left: auto; right: -5px; top: 8px; bottom: 8px; width: 1.5px; height: auto; }
  .toolbar { max-width: calc(100vw - 16px); overflow-x: auto; }
  .toolbar .tb-names { display: none; }
  .toolbar.labeled button, .toolbar.labeled a.home { width: 40px; padding: 0; justify-content: center; }
  .toolbar.labeled .tb-label { display: none; }
  .toolbar .tb-sep { width: 1.5px; height: auto; margin: 8px 1px; }
  body::after { content: "가로로 돌리면 크게 보여요"; position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 45; background: var(--ink); color: var(--paper-2); font: 600 15px var(--f-body); padding: 6px 14px; border-radius: 999px; white-space: nowrap; pointer-events: none; animation: rotate-hint 6s ease forwards; }
  @keyframes rotate-hint { 0%, 80% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
}
@media (prefers-reduced-motion: reduce) {
  .mark { transition: none; }
}
@media print {
  .toolbar { display: none !important; }
}

/* ---------- 공통: 제목줄·본문 격자 (2~7번 장) ---------- */
:root { --field-soft: #efe8f8; --wall: #e6ece9; --steel: #b7bcc4; --glass: #cfe0ea; --wood: #cdbfa8; --phone: #2b3242; }
#zoom .head, #field .head, #inquiry .head, #wrap .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
#zoom .head .titles, #field .head .titles, #inquiry .head .titles, #wrap .head .titles { display: flex; flex-direction: column; gap: 6px; }
#zoom .head .pen, #field .head .pen, #inquiry .head .pen { font-size: 44px; transform: rotate(-1.5deg); padding-bottom: 6px; white-space: nowrap; }
#zoom .frame, #field .frame, #inquiry .frame, #wrap .frame { gap: 20px; }
#field .body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1060px 1fr; gap: 28px; }
.note-card { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; font-size: 26px; line-height: 1.42; }
.note-card .tag, .kit .tag, .galv-text .tag, .next .tag { font-size: 21px; letter-spacing: .12em; font-weight: 700; color: var(--accent); }
.ticks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 25px; line-height: 1.4; }
.ticks li { position: relative; padding-left: 32px; }
.ticks li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 800; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.seg.seg2 { grid-template-columns: repeat(2, 1fr); }
.seg.small button { font-size: 22px; padding: 11px 6px; }

/* ---------- 2. 줌인 ---------- */
.journey { position: relative; flex: 1 1 auto; min-height: 0; }
.zs { display: block; width: 100%; height: 100%; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; }
.zs .ln { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.zs .ln.thin { stroke-width: 2.5; }
.zs .cable { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.zs .cable.thin { stroke-width: 2.5; opacity: .55; }
.zs .flow { fill: none; stroke: var(--current); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1 27; }
.zs .wall { fill: var(--wall); stroke: var(--ink); stroke-width: 3; }
.zs .plate { fill: var(--paper-2); stroke: var(--ink); stroke-width: 4; }
.zs .hole, .zs .plug { fill: var(--ink); }
.zs .table { fill: var(--wood); stroke: var(--ink); stroke-width: 3; }
.zs .phone { fill: var(--phone); stroke: var(--ink); stroke-width: 4; }
.zs .screen { fill: var(--paper-2); }
.zs .charge { fill: var(--induced); }
.zs .bolt { fill: var(--current); stroke: var(--ink); stroke-width: 2; }
.zs .building { fill: #e1e7e4; stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
.zs .steam circle { fill: #ffffff; stroke: var(--rule); stroke-width: 3; }
.zs .windows rect { fill: var(--glass); stroke: var(--ink); stroke-width: 2; }
.zs .svg-label { font: 700 34px var(--f-body); fill: var(--ink); }
.zs .svg-pen { font: 400 50px var(--f-pen); fill: var(--ink); }
.zs .pipe { fill: none; stroke: var(--steel); stroke-width: 22; stroke-linecap: round; }
.zs .steamline { fill: none; stroke: var(--ink-3); stroke-width: 4; stroke-dasharray: 12 12; stroke-linecap: round; }
.zs .shaft { fill: var(--steel); stroke: var(--ink); stroke-width: 3; }
.zs .housing { fill: var(--paper-2); stroke: var(--ink); stroke-width: 6; }
.zs .blade { fill: #dfe5e8; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.zs .hub { fill: var(--ink-2); stroke: var(--ink); stroke-width: 3; }
.zs .stator { fill: var(--wall); stroke: var(--ink); stroke-width: 6; }
.zs .gcoil { fill: var(--copper-f); stroke: var(--ink); stroke-width: 2; }
.zs .rotor { fill: var(--paper-2); stroke: var(--ink); stroke-width: 4; }
.zs .mag-n { fill: var(--n); }
.zs .mag-s { fill: var(--s); }
.zs .mag-t { font: 700 40px var(--f-body); fill: var(--paper-2); }
.stops { position: absolute; left: 20px; top: 16px; display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
.stops li { font-size: 22px; font-weight: 600; padding: 6px 16px; border: 2px solid var(--rule); border-radius: 999px; background: var(--paper-2); color: var(--ink-3); }
.stops li.done { border-color: var(--ink-2); color: var(--ink-2); }
.stops li.on { border-color: var(--ink); background: var(--ink); color: var(--paper-2); }
.zcap { position: absolute; left: 20px; bottom: 18px; max-width: 1040px; display: flex; gap: 16px; align-items: baseline; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 14px 24px; box-shadow: 5px 5px 0 var(--ink); }
.zcap .no { font: 800 40px var(--f-display); }
.zcap p { font-size: 30px; line-height: 1.4; }

/* ---------- 3. 자기장 복습 ---------- */
.ftab { display: flex; flex-direction: column; gap: 14px; }
.ctl { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; }
.hand-card { flex-direction: row; align-items: center; gap: 14px; }
.hand-card p { font-size: 23px; line-height: 1.4; }
.hand { flex: 0 0 196px; width: 196px; height: auto; }
.hand .hand-curl { fill: none; stroke: var(--current); stroke-width: 5; }
.hand .hand-tip { fill: var(--current); }
.hand .hand-thumb { fill: none; stroke: var(--n); stroke-width: 6; stroke-linecap: round; }
.hand .hand-thumb-tip { fill: var(--n); }
.hand text { font: 600 15px var(--f-body); fill: var(--ink-2); }

/* ---------- 4. 탐구 안내와 예측 ---------- */
#inquiry .body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 860px 1fr; gap: 48px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.kit ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.kit li { font-size: 24px; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 16px; background: var(--paper-2); }
.steps { margin: 0; padding-left: 38px; font-size: 27px; line-height: 1.45; display: flex; flex-direction: column; gap: 6px; }
.galv-card { display: grid; grid-template-columns: 210px 1fr; gap: 18px; align-items: center; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 14px 18px; }
.galv { width: 210px; height: auto; }
.galv .ln { fill: none; stroke: var(--ink); stroke-width: 4; }
.galv .galv-ticks line { stroke: var(--ink); stroke-width: 2.5; }
.galv .galv-needle { stroke: var(--n); stroke-width: 5; stroke-linecap: round; }
.galv .galv-pivot { fill: var(--ink); }
.galv .galv-zero { font: 700 18px var(--f-body); fill: var(--ink-2); }
.galv-text { display: flex; flex-direction: column; gap: 6px; }
.galv-text p { font-size: 24px; line-height: 1.42; }
.galv-ctl { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; }
.galv-ctl input { flex: 1; min-width: 0; height: 30px; accent-color: var(--accent); }
.galv-read { font-size: 36px; color: var(--ink); }
.preds { display: flex; flex-direction: column; gap: 14px; }
.pred { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.pred p { font-size: 28px; line-height: 1.38; }
.pred-note { font-size: 36px; }

/* 결과 표의 예측 맞춰 보기 */
.pred-badge { display: block; font: 700 19px var(--f-body); letter-spacing: .06em; color: var(--ink-3); }
.pred-badge.ok { color: var(--induced); }
.pred-badge.no { color: var(--stamp); }
.fragment.custom:not(.visible) .pred-badge { visibility: hidden; }

/* ---------- 7. 에너지 전환과 확인 문제 ---------- */
#wrap .body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 820px 1fr; gap: 56px; }
.flow { display: flex; flex-direction: column; gap: 6px; }
.fbox { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 16px 22px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; font-size: 30px; line-height: 1.4; }
.fbox.mid { background: var(--field-soft); border-color: var(--field); }
.farrow { text-align: center; font: 700 40px/1 var(--f-body); color: var(--ink-2); }
.blank { font-family: var(--f-pen); font-size: 44px; white-space: nowrap; }
.blank .bk { display: inline-block; min-width: 2.6em; text-align: center; border-bottom: 3px solid var(--ink); color: var(--accent); }
.fragment.custom:not(.visible) .bk { color: transparent; }
.quiz { position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.quiz .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.qs { margin: 0; padding-left: 36px; display: flex; flex-direction: column; gap: 14px; font-size: 27px; }
.qs li { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; }
.qs li p { line-height: 1.38; }
.qs .why { grid-column: 1 / -1; font-size: 22px; color: var(--ink-2); display: none; }
.qs li.answered .why { display: block; }
.ox { display: flex; gap: 8px; }
.ox button { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper-2); color: var(--ink); font: 700 30px/1 var(--f-body); cursor: pointer; }
.ox button:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }
.ox button.pick.right { background: var(--induced); border-color: var(--induced); color: var(--paper-2); }
.ox button.pick.wrong { background: var(--stamp); border-color: var(--stamp); color: var(--paper-2); }
.ox button.answer { box-shadow: 0 0 0 5px var(--hl); }
.quiz .stamp { right: 0; top: auto; bottom: -24px; }
.next { display: flex; gap: 22px; align-items: baseline; border-top: 3px solid var(--ink); padding-top: 14px; }
.next p { font: 700 32px/1.3 var(--f-display); }
.next .next-go { margin-left: auto; align-self: center; flex: 0 0 auto; font: 700 24px/1 var(--f-body); color: var(--paper-2); background: var(--accent); border: 2px solid var(--accent); border-radius: 999px; padding: 14px 26px; text-decoration: none; white-space: nowrap; }
.next .next-go:hover { background: var(--ink); border-color: var(--ink); }
.next .next-go:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }

/* ---------- 1차 점검 뒤 고침 ---------- */
[hidden] { display: none !important; }           /* display를 준 칸(.ftab)도 hidden이면 숨긴다 */
.journey { display: flex; flex-direction: column; gap: 12px; }
.journey .zs { flex: 1 1 auto; min-height: 0; height: auto; }
.zcap { position: static; max-width: none; box-shadow: none; }
div.answer { padding-right: 150px; }
#flap .stamp { top: -46px; right: 6px; width: 140px; height: 140px; }
.hand { flex-basis: 230px; width: 230px; }
.hand text { font-size: 18px; }

/* ===================== 2차시부터 쓰는 공용 틀 ===================== */
section.std .frame { gap: 20px; }
.head.split { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
.head.split .titles { display: flex; flex-direction: column; gap: 6px; }
.head.split .pen { font-size: 44px; transform: rotate(-1.5deg); padding-bottom: 6px; white-space: nowrap; }
.head-act { display: flex; align-items: center; gap: 22px; }
.body.sim { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1060px 1fr; gap: 28px; }
.body.two { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: var(--left, 860px) 1fr; gap: 48px; }
.seg.seg3 { grid-template-columns: repeat(3, 1fr); }
.btn.play { background: var(--ink); color: var(--paper-2); border-color: var(--ink); }
.btn.play:hover { background: var(--accent); border-color: var(--accent); }
.small-pen { font-size: 32px; }
.rule { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 12px 16px; font-size: 23px; line-height: 1.45; }

/* 2. 다섯 경우 */
table.cases { width: 100%; border-collapse: collapse; font-size: 23px; }
table.cases th { text-align: left; font-size: 19px; letter-spacing: .06em; color: var(--ink-2); font-weight: 700; padding: 0 6px 8px; border-bottom: 3px solid var(--ink); line-height: 1.25; }
table.cases td { padding: 10px 6px; border-bottom: 2px solid var(--rule); line-height: 1.3; }
table.cases tbody tr { cursor: pointer; }
table.cases tbody tr:hover td { background: var(--accent-soft); }
table.cases tbody tr.on td { background: var(--accent-soft); }
table.cases tbody tr:focus-visible { outline: 4px solid var(--hl); outline-offset: -2px; }
table.cases td.c-f, table.cases td.c-b { font-family: var(--f-pen); font-size: 34px; text-align: center; width: 120px; color: var(--ink-3); }
table.cases tr.done td.c-f, table.cases tr.done td.c-b { color: var(--ink); }

/* 3. 정의 */
.defs { display: flex; flex-direction: column; gap: 18px; }
.def { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 18px; font-size: 31px; line-height: 1.45; }
.def.soft { background: var(--field-soft); border-color: var(--field); font-size: 28px; }
.warn-card { background: var(--paper-2); border: 3px solid var(--stamp); border-radius: 10px; padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; align-self: start; }
.warn-card .tag { font-size: 21px; letter-spacing: .12em; font-weight: 700; color: var(--stamp); }
.warn-card .q { font-size: 30px; line-height: 1.42; }
.warn-card .small { font-size: 23px; color: var(--ink-2); line-height: 1.45; }
.vs { display: grid; grid-template-columns: 1fr; gap: 12px; }
.vs-a, .vs-b { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 12px; border: 2px solid var(--rule); border-radius: 8px; padding: 12px 16px; font-size: 28px; line-height: 1.4; }
.vs-a { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--stamp); }
.vs-b { border-color: var(--induced); }
.vs-t { font: 800 40px var(--f-body); text-align: center; }
.vs-a .vs-t { color: var(--stamp); text-decoration: none; }
.vs-b .vs-t { color: var(--induced); }

/* 4. 방향 */
.dir-cases { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dir-cases button { font: 600 24px/1 var(--f-body); padding: 14px 8px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper-2); color: var(--ink); cursor: pointer; }
.dir-cases button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper-2); }
.dir-cases button:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }
.dir-pred { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.dir-pred > span { grid-column: 1 / -1; font-size: 22px; font-weight: 600; color: var(--ink-2); }
.dir-pred .dir-verdict { grid-column: 1 / -1; font-size: 34px; min-height: 1.1em; }
table.dirt { width: 100%; border-collapse: collapse; font-size: 19px; table-layout: fixed; }
table.dirt th { font-weight: 700; color: var(--ink-2); padding: 6px 4px; line-height: 1.2; }
table.dirt thead th { border-bottom: 3px solid var(--ink); }
table.dirt tbody th { text-align: left; width: 86px; }
table.dirt td { text-align: center; padding: 8px 2px; border-bottom: 2px solid var(--rule); font-family: var(--f-pen); font-size: 26px; color: var(--ink-3); line-height: 1.1; }
table.dirt td.done { color: var(--ink); }

/* 5. 세기 */
.st-warn { min-height: 1.3em; font-size: 22px; font-weight: 600; color: var(--stamp); line-height: 1.35; }
.bars { display: flex; gap: 10px; height: 250px; border-bottom: 3px solid var(--ink); padding: 0 4px; }
.bars:empty::before { content: "아직 잰 결과가 없어요"; align-self: center; margin: 0 auto; font-family: var(--f-pen); font-size: 34px; color: var(--ink-3); }
.bars .b { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.bars .b .v { font: 600 20px var(--f-mono); }
.bars .b i { display: block; width: 70%; background: var(--current); border-radius: 4px 4px 0 0; }
.bars .b .l { font-size: 15px; line-height: 1.2; color: var(--ink-2); text-align: center; margin-bottom: -58px; height: 54px; }
.bars + .rule { margin-top: 58px; }

/* 6. 에너지 */
.stage.short { flex: 0 0 540px; }
.ebars { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; }
.ebar { display: grid; grid-template-columns: 250px 1fr; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; grid-column: 1; }
.ebar b { display: block; height: 24px; border: 2px solid var(--ink); border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.ebar b i { display: block; height: 100%; width: 0; background: var(--stamp); transition: width .2s; }
.ebar[data-e="elec"] b i { background: var(--current); }
.ebars .btn { grid-column: 2; grid-row: 1 / span 2; }
.en-note { font-size: 23px; line-height: 1.45; color: var(--ink-2); }
.en-note b { color: var(--ink); }

/* 7. 생활 속 이용 */
.cards { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 18px; }
.card { position: relative; perspective: 1400px; border: 0; padding: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
.card:focus-visible { outline: 4px solid var(--hl); outline-offset: 4px; border-radius: 10px; }
.card .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px 20px; transition: transform .6s cubic-bezier(.3, .7, .3, 1); }
.card .front svg { width: 104px; height: 104px; fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.card .front b { font: 700 30px var(--f-display); }
.card .back { transform: rotateY(-180deg); background: var(--field-soft); border-color: var(--field); font-size: 24px; line-height: 1.5; text-align: left; justify-content: center; align-items: flex-start; }
.card.flipped .front { transform: rotateY(180deg); }
.card.flipped .back { transform: rotateY(0); }
@media (prefers-reduced-motion: reduce) { .card .face { transition: none; } }

/* 8. 확인 문제 */
#check2 .quiz .stamp { bottom: auto; top: -40px; right: 0; width: 140px; height: 140px; }
.factors { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.factors .chips { display: flex; flex-direction: column; gap: 10px; }
.factors .chips button { text-align: left; font: 500 27px/1.3 var(--f-body); color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 12px 18px; cursor: pointer; }
.factors .chips button b { font-family: var(--f-display); margin-right: 10px; color: var(--ink-2); }
.factors .chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.factors .chips button.right { border-color: var(--induced); box-shadow: inset 0 0 0 2px var(--induced); }
.factors .chips button.wrong { border-color: var(--stamp); box-shadow: inset 0 0 0 2px var(--stamp); }
.factors .btn.play { align-self: flex-start; }
.f-result { font-family: var(--f-pen); font-size: 34px; line-height: 1.2; min-height: 2.4em; }
#check2 .quiz { height: 100%; }
#check2 .quiz .stamp { top: auto; bottom: 0; right: 0; }

/* ===================== 3차시 ===================== */
.make-card { padding: 54px 30px 26px; display: flex; flex-direction: column; gap: 14px; }
.make-card h3 { font: 700 40px var(--f-display); margin: 0; }
.make-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.make-steps li { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: start; font-size: 25px; line-height: 1.42; }
.make-steps li b { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--paper-2); font: 700 24px var(--f-body); }
.make-card .tip { font-size: 22px; line-height: 1.45; color: var(--ink-2); border-top: 2px dashed var(--rule); padding-top: 12px; }
.make-card .tip b { color: var(--accent); margin-right: 8px; }
#cover .fig-caption .cap { font-size: 21px; line-height: 1.4; }

.seg.seg4 { grid-template-columns: repeat(4, 1fr); }
.mini-read { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 14px; align-items: baseline; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 12px 18px; font-size: 22px; color: var(--ink-2); }
.mini-read b { font: 400 36px var(--f-pen); color: var(--ink); }
.swatch-hl { display: inline-block; width: 22px; height: 14px; background: var(--hl); margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
.chart.big canvas { height: 200px; }
.qa { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.qa .q { font-size: 25px; line-height: 1.42; }
.qa .a { font-size: 24px; line-height: 1.5; }
.eq { font-size: 25px; text-align: center; padding: 8px; border-top: 2px dashed var(--rule); }

.deg-steps { display: grid; grid-template-columns: repeat(4, 1fr) 1.6fr; gap: 8px; }
.deg-steps button { font: 700 24px/1 var(--f-body); padding: 14px 6px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper-2); color: var(--ink); cursor: pointer; }
.deg-steps button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper-2); }
.deg-steps button.auto { background: var(--ink); color: var(--paper-2); }
.deg-steps button:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }
.rot-cap { min-height: 3.2em; font-size: 25px; line-height: 1.42; background: var(--field-soft); border: 2px solid var(--field); border-radius: 6px; padding: 10px 14px; }
#rotor .chart canvas { height: 104px; }
#rotor .readout .count { font-size: 80px; }

.stage.g3 canvas { cursor: grab; }
.stage.g3 canvas:active { cursor: grabbing; }
.g3-label { position: absolute; left: 0; top: 0; pointer-events: none; font: 700 24px var(--f-body); color: var(--ink); background: rgba(251, 252, 249, .88); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
.stage.g3 .tools { top: auto; bottom: 14px; right: 14px; }
.no3d-msg { display: none; position: absolute; inset: 0; place-items: center; text-align: center; padding: 40px; font-size: 28px; color: var(--ink-2); }
.stage.no3d .no3d-msg { display: grid; }
.stage.no3d .g3-label, .stage.no3d .tools { display: none; }
.parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.parts li { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 12px 16px; font-size: 23px; line-height: 1.42; display: flex; flex-direction: column; gap: 2px; cursor: default; }
.parts li b { font: 700 27px var(--f-display); }
.parts li:hover, .parts li:focus-visible { background: var(--accent-soft); outline: none; }
.chain { display: flex; flex-direction: column; gap: 12px; font-size: 24px; line-height: 1.5; border-top: 2px dashed var(--rule); padding-top: 12px; }
.g3-bulb { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; }
.g3-bulb b { display: block; height: 26px; border: 2px solid var(--ink); border-radius: 13px; background: var(--paper-2); overflow: hidden; }
.g3-bulb b i { display: block; height: 100%; background: linear-gradient(90deg, var(--glow), var(--current)); opacity: 0; transition: opacity .2s; }

.srcs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.src { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 10px; padding: 16px 20px; display: grid; grid-template-columns: 170px 1fr; grid-template-rows: auto auto; align-items: center; column-gap: 16px; }
.src svg { grid-row: span 2; width: 170px; height: 128px; fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.src b { font: 700 40px var(--f-display); align-self: end; }
.src span { font-size: 25px; color: var(--ink-2); align-self: start; }
.src .air, .src .water, .src .steam, .sup .steam { stroke: var(--s); stroke-dasharray: 10 10; }
.supply { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 640px; gap: 36px; align-items: center; border-top: 3px solid var(--ink); padding-top: 18px; }
.sup { width: 100%; height: auto; fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.sup .rot2 rect { fill: var(--n); }
.sup .bulb2 { fill: var(--glow); }
.sup-text { display: flex; flex-direction: column; gap: 14px; font-size: 27px; line-height: 1.5; }

.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; align-self: start; }
.recap li { position: relative; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 14px 18px; font-size: 26px; line-height: 1.4; margin-bottom: 34px; }
.recap li:last-child { margin-bottom: 0; background: var(--field-soft); border-color: var(--field); font-weight: 700; }
.recap li:not(:last-child)::after { content: "↓"; position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); font: 700 28px/34px var(--f-body); color: var(--ink-2); }
#check3 .quiz { height: 100%; }
#check3 .quiz .stamp { top: auto; bottom: 0; right: 0; }

/* ===================== 4차시: 화력 발전과 핵발전 ===================== */
/* 에너지 형태 색: 전환 순서대로 이웃한 색끼리 색각 검사 통과(전기 노랑은 늘 글자 이름표와 함께) */
:root { --e-chem: #6f5bd6; --e-nuc: #b0308f; --e-pot: #3a8fd0; --e-heat: #d9482b; --e-kin: #1b8a5f; --e-elec: #c78b00; }

/* 1. 표지: 예측 → 발전 비중 */
#cover .share-card { padding: 60px 30px 26px; display: flex; flex-direction: column; gap: 18px; }
#cover .share-card h3 { margin: 0; font: 700 34px/1.3 var(--f-display); color: var(--ink); text-wrap: balance; }
.share-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.share-opts button { font: 600 25px/1.2 var(--f-body); padding: 14px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper-2); color: var(--ink); cursor: pointer; }
.share-opts button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper-2); }
.share-opts button:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }
.share { display: flex; flex-direction: column; gap: 8px; border-top: 2px dashed var(--rule); padding-top: 14px; }
.srow { position: relative; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; gap: 14px; font-size: 26px; padding: 4px 8px; border-radius: 6px; }
.srow b { display: block; height: 30px; background: var(--grid); border-radius: 0 4px 4px 0; overflow: hidden; }
.srow b i { display: block; height: 100%; width: 0; background: var(--ink-2); border-radius: 0 4px 4px 0; }
.srow em { font: 500 26px var(--f-mono); font-style: normal; text-align: right; }
.srow:first-child span, .srow:first-child em { font-weight: 700; }
.srow:first-child b i { background: var(--ink); }
.srow.picked { background: var(--hl); }
.srow.picked::after { content: "우리 반 예측"; position: absolute; right: 116px; top: 50%; transform: translateY(-50%); font-size: 17px; font-weight: 700; color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.share .sum { font-size: 24px; line-height: 1.4; margin-top: 4px; }
.share .share-src { font-size: 19px; line-height: 1.4; color: var(--ink-3); }

/* 2. 발전소의 에너지 흐름 */
.plant-stage svg.pl { position: absolute; inset: 0; width: 100%; height: 100%; }
.pl-ground { stroke: var(--ink); stroke-width: 3; }
.pl-t { font: 600 26px var(--f-body); fill: var(--ink); text-anchor: middle; }
.pl-t.small { font-size: 21px; fill: var(--ink-2); }
.pl-bld { fill: var(--wall); stroke: var(--ink); stroke-width: 3; }
.pl-coal { fill: var(--ink); opacity: .82; }
.pl-tube { stroke: var(--grid-strong); stroke-width: 7; stroke-linecap: round; }
.pl-flame path { fill: var(--current); }
.pl-smoke circle { fill: var(--ink-3); opacity: .4; }
.pl-pipe { fill: none; stroke: var(--grid-strong); stroke-width: 22; stroke-linejoin: round; stroke-linecap: round; }
.pl-water { fill: none; stroke: var(--e-pot); stroke-opacity: .5; stroke-width: 8; stroke-dasharray: 16 8; stroke-linejoin: round; }
.pl-cond { fill: var(--paper-2); stroke: var(--ink-2); stroke-width: 2.5; }
.pl-vessel { fill: var(--grid); stroke: var(--ink); stroke-width: 3; }
.pl-fuel rect { fill: var(--e-nuc); }
.pl-res, .pl-river { fill: var(--glass); stroke: var(--e-pot); stroke-width: 2; stroke-dasharray: 24 10; }
.pl-dam { fill: var(--grid-strong); stroke: var(--ink); stroke-width: 3; }
.pl-turb { fill: var(--paper-2); stroke: var(--ink); stroke-width: 3; }
.pl-rot path { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.pl-shaft { fill: var(--ink-2); }
.pl-gen { fill: var(--paper-2); stroke: var(--ink); stroke-width: 3; }
.pl-mag-n { fill: var(--n); } .pl-mag-s { fill: var(--s); }
.pl-wire { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
.pl-tower { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.dot { stroke: var(--paper-2); stroke-width: 2.5; }
.dot.e-chem { fill: var(--e-chem); } .dot.e-nuc { fill: var(--e-nuc); } .dot.e-pot { fill: var(--e-pot); }
.dot.e-heat { fill: var(--e-heat); } .dot.e-kin { fill: var(--e-kin); } .dot.e-elec { fill: var(--e-elec); }
.pl-card { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 18px 22px; display: flex; flex-direction: column; gap: 4px; }
.pl-card .tag { font-size: 21px; letter-spacing: .12em; font-weight: 700; color: var(--accent); }
.pl-card .tag:not(:first-child) { margin-top: 10px; }
.pl-card p { font-size: 27px; line-height: 1.45; }
.pl-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pl-chain i { font-style: normal; font-weight: 700; color: var(--ink-2); }
.e-legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 22px; color: var(--ink-2); }
.e-legend i { display: inline-block; width: 20px; height: 20px; border-radius: 50%; vertical-align: -3px; margin-right: 10px; box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3px var(--rule); }

/* 에너지 이름표: 글자는 잉크색, 왼쪽 띠가 에너지 색 */
.ech { display: inline-block; font: 700 30px/1 var(--f-body); color: var(--ink); white-space: nowrap; background: var(--paper-2); border: 2px solid var(--ink); border-left: 14px solid var(--c); border-radius: 8px; padding: 16px 20px; }
.ech.sm { font-size: 22px; padding: 7px 12px; border-left-width: 10px; border-radius: 6px; }

/* 3. 두 흐름 겹치기 + 순서 */
.body.stack { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 28px; }
.mg { position: relative; display: flex; flex-direction: column; gap: 56px; padding: 28px 34px; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; }
.mg-row { display: flex; align-items: center; gap: 18px; }
.mg-name { flex: 0 0 180px; font: 700 34px var(--f-display); }
.mg-row > i { font: normal 700 36px/1 var(--f-body); color: var(--ink-2); }
.mg .ech { transition: box-shadow .4s; }
.mg.merged .mg-row[data-r="fire"] .ech.same { box-shadow: 0 0 0 6px var(--hl); }
.mg-note { font-size: 30px; line-height: 1.45; margin-top: -18px; }
.order { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.order-head { display: flex; align-items: center; gap: 22px; }
.order-head .seg { width: 340px; }
.ord-msg { font-size: 40px; color: var(--accent); }
.order-body { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.slots { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.slots li { counter-increment: s; position: relative; min-height: 60px; display: flex; align-items: center; padding: 8px 16px 8px 66px; border: 2px dashed var(--rule); border-radius: 8px; font-size: 25px; line-height: 1.3; }
.slots li::before { content: counter(s); position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink-2); font: 700 21px/32px var(--f-body); text-align: center; color: var(--ink-2); box-sizing: border-box; }
.slots li.done { border-style: solid; border-color: var(--ink); background: var(--paper-2); }
.slots li.same { box-shadow: inset 0 -6px 0 var(--hl); }
.pool { display: flex; flex-direction: column; gap: 10px; }
.ocard { min-height: 60px; text-align: left; font: 500 25px/1.3 var(--f-body); color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 8px 18px; cursor: pointer; }
.ocard:hover { background: var(--accent-soft); }
.ocard:focus-visible { outline: 4px solid var(--hl); outline-offset: 3px; }
.ocard.used { opacity: .22; pointer-events: none; }
.ocard.nope { border-color: var(--stamp); box-shadow: inset 0 0 0 3px var(--stamp); }

/* 4. 장단점 */
.cards.cards2 { grid-template-columns: 1fr 1fr; }
.cards2 .card .front b { font-size: 40px; }
.cards2 .card .front b u { text-decoration-thickness: 5px; text-underline-offset: 8px; text-decoration-color: var(--accent); }
.cards2 .card .back ul { margin: 0; padding-left: 28px; display: flex; flex-direction: column; gap: 8px; font-size: 25px; line-height: 1.42; }

/* 5. 전력 수요 */
#demand .chart.big canvas { height: 600px; }
.d-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 22px; color: var(--ink-2); }
.d-legend i { display: inline-block; width: 28px; height: 18px; border-radius: 3px; vertical-align: -3px; margin-right: 8px; }
.d-legend .bd-nuc { background: var(--e-nuc); opacity: .55; }
.d-legend .bd-fire { background: var(--e-heat); opacity: .5; }
.d-legend .ln-dem { height: 4px; vertical-align: 4px; background: var(--ink); }
.d-legend .ln-short { background: repeating-linear-gradient(45deg, var(--ink-2) 0 2px, transparent 2px 7px); border: 1px solid var(--ink-2); }
.d-story { font-size: 27px; line-height: 1.5; }
.col-btns { flex-direction: column; align-items: flex-start; }
.d-result { font-family: var(--f-pen); font-size: 38px; line-height: 1.2; min-height: 2.4em; }
.d-why { font-size: 25px; }

/* 6. 생활에 미치는 영향 */
.aspects { display: flex; flex-wrap: wrap; gap: 10px; }
.aspects span { border: 2px solid var(--ink); border-radius: 999px; padding: 4px 16px; font-size: 24px; background: var(--paper-2); }
.calc { display: flex; flex-direction: column; gap: 14px; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; padding: 22px 26px; align-self: start; }
.calc-in { display: flex; align-items: center; gap: 14px; font-size: 26px; }
.calc-in input { width: 300px; font: 500 34px var(--f-mono); padding: 8px 14px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); color: var(--ink); }
.calc-in input:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
.calc-eg { font-size: 21px; color: var(--ink-3); margin-top: -6px; }
.calc .btn.play { align-self: flex-start; }
.calc-steps { margin: 0; padding-left: 34px; display: flex; flex-direction: column; gap: 8px; font-size: 25px; }
.calc-steps li { display: flex; justify-content: space-between; gap: 18px; padding-bottom: 6px; border-bottom: 1px dashed var(--rule); }
.calc-steps b { font: 500 26px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.calc-ans { font-size: 60px; color: var(--accent); min-height: 1.05em; }
.people { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; min-height: 52px; }
.people svg { width: 30px; height: 46px; fill: var(--ink-2); }
.people .more { font: 700 30px var(--f-body); color: var(--ink-2); }
.calc-key { font-size: 20px; color: var(--ink-3); }

/* 7. 확인 */
#check4 .quiz { height: 100%; }
#check4 .quiz .stamp { top: auto; bottom: 0; right: 0; }
.eband polygon { fill: var(--paper-2); stroke: var(--c); stroke-width: 3; }
.eband text { font: 700 23px var(--f-body); fill: var(--ink); text-anchor: middle; }
.eband polygon { fill: color-mix(in srgb, var(--c) 16%, var(--paper-2)); }
.mg-name + .ech { width: 236px; box-sizing: border-box; }   /* 두 줄의 «같은» 칸이 세로로 나란하게 */
.cards2 .card .back { justify-content: flex-start; padding: 22px 28px; gap: 12px; }
.cards2 .card .back .bk-h { font: normal 700 24px var(--f-body); letter-spacing: .08em; color: var(--field); }
.cards2 .card .back ul { font-size: 27px; text-wrap: pretty; }
.reveal .d-result { line-height: 1.25; }
.note-card.warn { border-color: var(--stamp); }
.note-card.warn .tag { color: var(--stamp); }
.note-card.warn b { margin-right: 10px; }
.cards2 .card .back { padding: 16px 26px; gap: 8px; }
.cards2 .card .back ul { font-size: 25px; line-height: 1.36; gap: 6px; }

/* ===================== 수업방(2단계) ===================== */
/* 슬라이드 판(1920×1080) 밖, 화면에 그대로 붙는다. 프로젝터에서 뒤에서도 읽히게 크게 */
.room-badge {
  position: fixed; z-index: 60; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 96px); box-sizing: border-box;
  font: 500 15px/1.3 var(--f-body); color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 14px;
  box-shadow: 3px 3px 0 var(--ink);
}
.room-badge button { font: inherit; color: inherit; cursor: pointer; }
.room-badge .rb-open { border: 0; background: none; padding: 4px 0; text-align: left; }
.room-badge .rb-toggle { border: 2px solid var(--accent); background: var(--accent); color: var(--paper-2); border-radius: 999px; padding: 3px 12px; font-weight: 700; }
.room-badge .rb-me { border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-weight: 700; }
/* 과목 방 선생님: 이 차시로 수업할 반 고르기(지난번 반은 테두리만) */
.room-badge .rb-cls { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.room-badge .rb-cls .rb-toggle:not(.on) { background: var(--paper-2); color: var(--accent); }
.room-badge .rb-leave { border: 0; background: var(--paper); border-radius: 999px; min-width: 30px; height: 30px; padding: 0 8px; font-weight: 700; }
.room-badge .rb-leave[data-armed] { background: var(--stamp); color: var(--paper-2); }
.room-badge .rb-lost { color: var(--stamp); }
/* 한 줄로: 글이 넘치면 끝을 줄이고, 단추·반 번호는 꺾지 않는다. 휴대폰은 판서 도구가 아래에 있어 위쪽을 넓게 쓰고 글을 줄인다 */
.room-badge .rb-text, .room-badge .rb-open { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-badge .rb-toggle, .room-badge .rb-me, .room-badge .rb-leave { flex: none; white-space: nowrap; }
@media (max-width: 640px) { .room-badge .rb-w { display: none; } }
@media (max-width: 600px) and (orientation: portrait) { .room-badge { max-width: calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); } }
/* 왼쪽 도구 막대: 묶음 구분선, 수업 중 선생님 수업 도구(같은 모양 단추). 키가 작은 화면에서는 단추를 줄이고, 넘치면 막대 안에서 넘긴다 */
.toolbar button, .toolbar a.home { position: relative; flex: none; }
/* 화면 높이보다 길면 막대 안에서 넘긴다(패드 2026-11-02 «밑으로 스크롤이 안된다») */
.toolbar { max-height: calc(100vh - 36px); max-height: calc(100dvh - 36px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
@media (max-width: 600px) and (orientation: portrait) { .toolbar { max-height: none; overflow-y: hidden; overflow-x: auto; touch-action: pan-x; } }
/* 마우스를 올렸을 때 이름표: 막대 밖에 하나 띄운다(core.js) */
.tb-tip { position: fixed; z-index: 80; pointer-events: none; transform: translateY(-50%); font: 600 14px/1 var(--f-body); white-space: nowrap; color: var(--paper-2); background: var(--ink); border-radius: 8px; padding: 7px 10px; }
.toolbar .tb-label { display: none; }
/* 이름 보기: 그림 옆에 이름 */
.toolbar.labeled { border-radius: 20px; align-items: stretch; background: var(--paper-2); opacity: 1; }
.toolbar .tb-names[aria-pressed="true"] { background: transparent; color: var(--ink-2); }
.toolbar.labeled button, .toolbar.labeled a.home { width: auto; display: flex; justify-content: flex-start; gap: 10px; padding: 0 14px 0 9px; border-radius: 999px; }
.toolbar.labeled .tb-label { display: inline; font: 600 15px/1 var(--f-body); white-space: nowrap; }
.toolbar.labeled a.home::after { left: 12px; right: 12px; }
.toolbar .tb-sep { flex: none; display: block; height: 1.5px; margin: 1px 8px; background: var(--rule); }
.toolbar .tool-cls { display: contents; }
.toolbar .tool-cls[hidden], .toolbar .tool-cls button[hidden] { display: none; }
.toolbar .tool-cls button[data-t="attention"][aria-pressed="true"] { background: var(--stamp); }
.room-card .rc-tip { margin: 0; color: var(--ink-2); font-size: 15px; }
@media (max-height: 900px) { .toolbar { gap: 2px; } .toolbar button, .toolbar a.home { width: 36px; height: 36px; } .toolbar svg { width: 20px; height: 20px; } }
@media (max-height: 680px) { .toolbar { gap: 0; padding: 4px; } .toolbar button, .toolbar a.home { width: 32px; height: 32px; } .toolbar svg { width: 18px; height: 18px; } }
@media print { .room-away { display: none !important; } }

/* 선생님 수업 화면: 다른 화면으로 간 학생(배지 아래 작은 한 줄, 수업 내용보다 튀지 않게) */
.room-away {
  position: fixed; box-sizing: border-box; z-index: 60; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 50px); right: max(14px, env(safe-area-inset-right, 0px));
  max-width: min(46vw, 560px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font: 500 13px/1.3 var(--f-body); color: var(--ink-2); background: var(--paper-2); border: 1.5px solid var(--rule); border-left: 4px solid var(--stamp);
  border-radius: 8px; padding: 4px 10px;
}
.room-away b { color: var(--stamp); font-weight: 700; margin-right: 2px; }
.room-away i { font-style: normal; color: var(--ink-2); opacity: .75; }
.room-away { cursor: pointer; text-align: left; }
.room-away:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
/* 누르면 크게: 학생마다 한 줄 */
.room-away.big {
  display: flex; flex-direction: column; gap: 6px; white-space: normal; max-width: min(420px, 90vw); min-width: 240px; max-height: 70vh; overflow-y: auto;
  font-size: 20px; padding: 12px 16px; border-width: 2px; border-left-width: 6px; border-radius: 12px; box-shadow: 4px 4px 0 var(--ink);
}
.room-away.big b { font-size: 22px; }
.room-away .ra-x { position: absolute; top: 12px; right: 14px; font-size: 14px; color: var(--ink-2); }
.room-away .ra-row { display: flex; justify-content: space-between; gap: 18px; font-weight: 700; color: var(--ink); border-top: 1px solid var(--rule); padding-top: 6px; }
.room-away .ra-row i { font-weight: 600; }
/* 학생: 다른 화면에서 돌아왔을 때 가운데 큰 알림 */
.room-back {
  position: fixed; z-index: 80; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px; max-width: min(560px, 90vw); padding: 20px 26px; text-align: center; cursor: pointer;
  font: 500 17px/1.45 var(--f-body); color: var(--ink); background: var(--paper); border: 3px solid var(--stamp); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink);
}
.room-back b { font-size: 26px; color: var(--stamp); }
.room-back[hidden] { display: none; }
@media print { .room-back { display: none !important; } }
/* 학생: 화면을 나눈 동안 아래쪽 띠(위쪽은 수업방 배지 자리) */
.room-split {
  position: fixed; z-index: 79; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + 34px); transform: translateX(-50%); box-sizing: border-box;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; max-width: 94vw; padding: 8px 16px;
  font: 500 15px/1.35 var(--f-body); color: var(--ink); background: var(--paper); border: 2.5px solid var(--stamp); border-radius: 12px; box-shadow: 4px 4px 0 var(--ink);
}
.room-split b { color: var(--stamp); }
.room-split[hidden] { display: none; }
@media print { .room-split { display: none !important; } }
/* 선생님 수업방 패널: 다른 화면 기록 표 */
.rc-awaylog small { font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.rc-awaylog .ral { width: 100%; border-collapse: collapse; font-size: 15px; }
.rc-awaylog .ral th, .rc-awaylog .ral td { padding: 5px 8px; border-bottom: 1px solid var(--rule); text-align: left; }
.rc-awaylog .ral th { font-size: 13px; color: var(--ink-3); font-weight: 700; }
.rc-awaylog .ral tr.now td { color: var(--stamp); font-weight: 700; }
.room-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(29, 36, 51, .55); display: grid; place-items: center; padding: 16px; }
.room-card {
  width: min(980px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--paper-2); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px; box-shadow: 8px 8px 0 var(--ink); padding: clamp(16px, 3vh, 32px);
  font: 500 18px/1.5 var(--f-body); display: flex; flex-direction: column; gap: 16px;
}
.room-card h2 { margin: 0; font: 800 clamp(24px, 4vh, 36px)/1.2 var(--f-display); }
.room-card .rc-lead { margin: 0; color: var(--ink-2); }
.rc-row, .rc-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.rc-btn { font: 700 17px/1 var(--f-body); min-height: 46px; padding: 0 20px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-2); color: var(--ink); cursor: pointer; }
.rc-btn.main { background: var(--ink); color: var(--paper-2); }
a.rc-btn { display: inline-flex; align-items: center; text-decoration: none; }
.rc-btn:disabled { opacity: .5; }
.rc-msg { margin: 0; min-height: 1.5em; color: var(--stamp); font-weight: 600; }
.rc-join { display: flex; flex-wrap: wrap; gap: clamp(16px, 3vw, 40px); align-items: center; justify-content: center; }
.rc-codebox { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 320px; }
.rc-label { font-size: 16px; font-weight: 700; letter-spacing: .14em; color: var(--accent); }
.rc-code { font: 800 clamp(88px, 22vh, 220px)/0.95 var(--f-display); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.rc-how { margin: 0; font-size: clamp(17px, 2.4vh, 22px); }
.rc-link { margin: 0; font: 500 14px/1.4 var(--f-mono, monospace); color: var(--ink-3); overflow-wrap: anywhere; }
.rc-qr { flex: 0 0 auto; width: clamp(180px, 36vh, 320px); aspect-ratio: 1; max-width: 100%; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px; }
.rc-qr svg { width: 100%; height: 100%; display: block; }
.rc-count { font-size: 20px; margin-right: auto; }
.rc-count b { font: 800 30px var(--f-display); }
.rc-seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.rc-seg button { font: 700 16px/1 var(--f-body); min-height: 42px; padding: 0 16px; border: 0; background: var(--paper-2); color: var(--ink); cursor: pointer; }
.rc-seg button + button { border-left: 2px solid var(--ink); }
.rc-seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper-2); }
.rc-form { display: flex; flex-wrap: wrap; gap: 10px; }
/* 과목 방 학생: 우리 반 고르기 */
.rc-cls { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; }
.rc-cls .rc-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper-2); }
.rc-input { font: 800 44px/1 var(--f-display); letter-spacing: .3em; width: 6.2em; padding: 6px 14px; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); text-align: center; }
.rc-input:focus-visible, .rc-btn:focus-visible, .rc-seg button:focus-visible, .room-badge button:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
@media print { .room-badge, .room-overlay { display: none !important; } }
/* 응답 모으기: 선생님 화면의 «고른 학생 수» (슬라이드 판 안이라 1920 기준 크기) */
.live-n { position: absolute; top: -14px; right: -14px; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 999px; background: var(--current); color: #fff; font: 700 20px/34px var(--f-body); text-align: center; box-shadow: 0 0 0 3px var(--paper-2); pointer-events: none; z-index: 2; }
.live-n.zero { background: var(--ink-3); }
/* 칸이 붙은 단추 묶음(.seg)은 넘친 부분이 잘리므로 수를 글자 옆(좁은 6칸은 글자 아래)에 붙인다 */
.seg button .live-n { position: static; display: inline-block; vertical-align: 2px; margin-left: 8px; min-width: 28px; height: 28px; padding: 0 7px; font-size: 17px; line-height: 28px; box-shadow: none; }
.seg.seg6 button .live-n { display: block; margin: 5px auto 0; width: fit-content; }
.predict.live .option .tally .tb { display: none; }
.predict.live .option .tally span { font-weight: 700; color: var(--current); }
.room-badge .rb-flash { font-weight: 700; color: var(--accent); }
/* 한 낱말로 답하기 */
.room-card.wide { width: min(1500px, 100%); }
.room-card .rc-q { font: 800 clamp(26px, 5vh, 48px)/1.2 var(--f-display); }
.rc-cloud { position: relative; height: clamp(220px, 52vh, 620px); background: var(--paper); border: 2px dashed var(--rule); border-radius: 12px; }
.rc-cloud canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rc-empty { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--ink-3); font-size: 22px; }
.rc-words { display: flex; flex-wrap: wrap; gap: 6px; max-height: 18vh; overflow: auto; }
.rc-words button { font: 600 15px/1 var(--f-body); padding: 7px 12px; border: 1.5px solid var(--rule); border-radius: 999px; background: var(--paper-2); color: var(--ink); cursor: pointer; }
.rc-words button:hover { border-color: var(--stamp); color: var(--stamp); }
.rc-words b { color: var(--current); }
.rc-input.rc-prompt { font: 600 24px/1.3 var(--f-body); letter-spacing: 0; width: min(640px, 100%); text-align: left; }
.rc-input.rc-word { font: 700 30px/1.2 var(--f-body); letter-spacing: 0; width: min(360px, 100%); text-align: left; }
.rc-msg.ok { color: var(--accent); }
/* 학생 현황·주목 */
.rc-where { display: flex; flex-wrap: wrap; gap: 8px; }
.rc-where span { flex: 1 1 140px; background: var(--paper); border: 2px solid var(--rule); border-radius: 10px; padding: 8px 12px; font-size: 15px; color: var(--ink-2); }
.rc-where b { display: block; font: 800 30px/1.1 var(--f-display); color: var(--ink); }
.rc-where span:first-child { border-color: var(--accent); background: var(--accent-soft); }
.rc-btn.warn { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.room-attention { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: var(--ink); color: var(--paper-2); text-align: center; padding: 24px; }
.room-attention b { display: block; font: 800 clamp(40px, 10vw, 120px)/1.1 var(--f-display); }
.room-attention span { display: block; margin-top: 12px; font: 600 clamp(16px, 3vw, 26px)/1.4 var(--f-body); opacity: .8; }
.rc-code.long { font-size: clamp(60px, 14vh, 150px); letter-spacing: .02em; }
/* 번호 칸(번호를 받는 반) */
.rc-roster { display: grid; gap: 8px; }
.rs-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; color: var(--ink-2); }
.rs-head i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
.rc-btn.small { min-height: 34px; padding: 0 12px; font-size: 14px; margin-left: auto; }
.rs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.rs { position: relative; border-radius: 8px; padding: 6px 4px; text-align: center; border: 2px solid transparent; min-height: 48px; display: grid; align-content: center; }
.rs b { font: 800 20px/1 var(--f-display); }
.rs i { font: 600 11px/1.2 var(--f-body); font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs em { position: absolute; top: 2px; right: 4px; font: 700 11px/1 var(--f-body); font-style: normal; opacity: .75; }
.rs u { position: absolute; bottom: 2px; right: 4px; font: 700 11px/1 var(--f-body); text-decoration: none; color: var(--stamp); }
.rs.same, .rs-head i.same { background: var(--accent-soft); border-color: var(--accent); }
.rs.slide, .rs-head i.slide { background: #fff3c4; border-color: #c99a1a; }
.rs.away, .rs-head i.away { background: #ffe0cc; border-color: var(--current); }
.rs.off, .rs-head i.off { background: var(--paper); border-color: var(--rule); color: var(--ink-3); }
.rs.over { border-style: dashed; }                     /* 인원보다 큰 번호(잘못 넣었을 수 있다) */
.rs.dup { box-shadow: 0 0 0 2px var(--stamp); }        /* 같은 번호로 두 기기 이상 */
.rc-input.rc-num { width: 5em; letter-spacing: 0; }
.rc-input.rc-name { width: 7em; letter-spacing: 0; font-size: 30px; }
/* 한 낱말: 숨긴 낱말 · 쓴 사람(선생님) · 공감·반대(학생) */
.rc-words button.hid { opacity: .6; border-style: dashed; }
.rc-words small { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.rc-words.rc-wlist { flex-direction: column; flex-wrap: nowrap; gap: 4px; max-height: 36vh; }
.rw { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 10px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--paper); }
.rw.hid { opacity: .65; border-style: dashed; }
.rw-w { font: 700 18px/1.2 var(--f-body); min-width: 6em; }
.rw-w b { color: var(--current); }
.rw-by { flex: 1 1 260px; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.rw-by span { font: 600 14px/1 var(--f-body); padding: 5px 8px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--rule); }
.rw-by i { color: var(--ink-3); font-size: 14px; }
.rw .rc-btn.small, .rw-note .rc-btn.small { margin-left: 0; }
.rw-note { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-2); }
.rw-msg { color: var(--stamp); font-weight: 600; }
.rc-btn.on { background: var(--accent); border-color: var(--accent); color: var(--paper-2); }
.rc-votebox { display: grid; gap: 8px; }
.rc-votebox h3 { margin: 0; font: 800 22px/1.2 var(--f-display); }
.rc-vote { display: grid; gap: 6px; max-height: 46vh; overflow: auto; }
.rv { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--paper); }
.rv-w { flex: 1 1 auto; min-width: 0; font: 700 20px/1.2 var(--f-body); overflow-wrap: anywhere; }
.rv-w i { font: 600 13px var(--f-body); font-style: normal; color: var(--ink-3); }
.rv-own { font: 700 14px var(--f-body); color: var(--accent); padding: 0 8px; }
.rv-b { font: 700 15px/1 var(--f-body); min-height: 38px; min-width: 60px; padding: 0 10px; border: 2px solid var(--rule); border-radius: 999px; background: var(--paper-2); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.rv-b span { font-size: 15px; line-height: 1; }
.rv-b[aria-pressed="true"] { border-color: var(--stamp); background: #ffe3e6; }
.rv-b.down[aria-pressed="true"] { border-color: var(--ink-2); background: var(--paper); }
.rv-b:not([aria-pressed="true"]) span { filter: grayscale(.35); }
.rv-b:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
/* 수업 패널: 학생 표시 바꾸기 */
/* 수업 패널 아래: 쓰임새대로 세 묶음 + 맨 아래 한 줄 */
.rc-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.rc-group { display: grid; gap: 8px; align-content: start; padding: 10px 12px 12px; border: 2px solid var(--rule); border-radius: 12px; background: var(--paper); }
.rc-group h3 { margin: 0; font: 700 13px/1.2 var(--f-body); letter-spacing: .12em; color: var(--ink-3); }
.rc-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rc-group .rc-btn { min-height: 42px; padding: 0 16px; font-size: 16px; }
.rc-group .rc-seg button { min-height: 38px; padding: 0 12px; font-size: 15px; }
.rc-btn.quiet { border-color: var(--rule); color: var(--ink-2); background: transparent; }
.rc-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding-top: 4px; }
.rc-foot .rc-count { margin-right: 0; }
.rc-idmsg { font-size: 14px; font-weight: 600; color: var(--accent); }
/* 낱말 구름(글자로 그린다): 자리는 그대로, ❤️·💔로 크기만 바뀐다 */
.rc-cv { position: absolute; inset: 0; overflow: hidden; }
.rc-w { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 800 20px/1 var(--f-display); letter-spacing: -.01em; transition: font-size .55s cubic-bezier(.3, 1.35, .5, 1), left .5s ease, top .5s ease, opacity .45s ease; }
.rc-w.new { opacity: 0; }
.rc-ruler { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: nowrap; font: 800 100px/1 var(--f-display); letter-spacing: -.01em; }
@media (prefers-reduced-motion: reduce) { .rc-w { transition: none; } }
.rs-empty { margin: 0; padding: 10px 12px; border: 1.5px dashed var(--rule); border-radius: 10px; font-size: 15px; color: var(--ink-3); }
.rc-size { display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1 var(--f-body); color: var(--ink-2); }
.rc-size input { width: 4.6em; min-height: 42px; padding: 0 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper-2); color: var(--ink); font: 700 17px/1 var(--f-body); }
.rc-size input:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
.rc-size[hidden] { display: none; }

/* ===================== 모둠 활동(group.js) ===================== */
/* 화면 아래 모둠 줄: 우리 모둠·고르기·한 줄 정리·제출 / 선생님: 모둠 판 보기 / 발표 중 띠 */
.grp-bar {
  position: fixed; z-index: 58; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; width: max-content; max-width: calc(100vw - 150px);
  font: 500 15px/1.3 var(--f-body); color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink); border-radius: 18px; padding: 6px 10px 6px 16px;
  box-shadow: 3px 3px 0 var(--ink);
}
.grp-bar[hidden] { display: none; }
.grp-bar.pres { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--paper-2)); }
.grp-bar b { font-weight: 800; }

.gb-btn { font: 700 15px/1 var(--f-body); min-height: 36px; padding: 0 14px; border: 2px solid var(--accent); border-radius: 999px; background: var(--accent); color: var(--paper-2); cursor: pointer; white-space: nowrap; }

.gb-btn.done { background: #1f7a3f; border-color: #1f7a3f; }

.gb-pick { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.gb-memo { font: 400 22px/1.1 var(--f-pen); color: var(--ink); max-width: 36em; overflow-wrap: anywhere; }

@media (max-height: 560px) {
