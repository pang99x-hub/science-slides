/* 고칠 수 없을 때(발표 중·다른 모둠 판을 보는 중) 장 위 덮개. 가리키기 중이면 십자 표시 */
.reveal .slides section > .grp-shield { position: absolute; inset: 0; z-index: 50; background: transparent; cursor: not-allowed; touch-action: none; }
.reveal .slides section > .grp-shield.pointing { cursor: crosshair; }
.reveal .slides section > .grp-shield[hidden] { display: none; }
.grp-ptr { position: fixed; z-index: 57; width: 0; height: 0; pointer-events: none; }
.grp-ptr[hidden] { display: none; }
.grp-ptr i { position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--stamp); background: color-mix(in srgb, var(--stamp) 25%, transparent); animation: grp-ping 1.2s ease-out infinite; }
.grp-ptr span { position: absolute; left: 22px; top: -30px; white-space: nowrap; font: 700 13px/1 var(--f-body); color: #fff; background: var(--stamp); border-radius: 999px; padding: 4px 8px; }
@keyframes grp-ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--stamp) 50%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
@media (prefers-reduced-motion: reduce) { .grp-ptr i { animation: none; } }
/* 선생님: 모둠 짜기 */
.gp-ctl { display: grid; gap: 8px; padding: 10px 12px; border: 2px solid var(--rule); border-radius: 12px; background: var(--paper); }
.gp-lab { font: 700 15px var(--f-body); color: var(--ink-2); }
.gp-n { font: 800 28px/1 var(--f-display); min-width: 1.4em; text-align: center; }
.rc-btn.small.gp-step { margin-left: 0; min-width: 40px; font-size: 20px; }
.gp-tip { margin: 0; font-size: 14px; color: var(--ink-3); }
.gp-boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.gp-box { border: 2px solid var(--ink); border-radius: 12px; background: var(--paper-2); padding: 8px 10px 10px; min-height: 96px; display: grid; gap: 6px; align-content: start; cursor: pointer; }
.gp-box.none { border-style: dashed; border-color: var(--ink-3); background: var(--paper); }
.gp-box.over { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 0 3px var(--hl); }
.gp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.gp-h b { font: 800 19px/1.2 var(--f-display); }
.gp-h span { font-size: 13px; color: var(--ink-3); }
.gp-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.gp-chips i { font-size: 13px; color: var(--ink-3); }
.gp-chip { font: 700 14px/1 var(--f-body); padding: 8px 11px; border: 1.5px solid var(--ink-2); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: grab; touch-action: none; user-select: none; }
.gp-chip.off { opacity: .5; border-style: dashed; }
.gp-chip.sel { background: var(--hl); border-color: var(--ink); }
.gp-chip.lift { opacity: .3; }
.gp-chip.ghost { position: fixed; z-index: 100; transform: translate(-50%, -60%); pointer-events: none; box-shadow: 0 8px 18px rgba(29, 36, 51, .3); background: var(--hl); cursor: grabbing; }
.gp-foot .rc-msg { margin-right: auto; }
.gp-foot .rc-btn.main { margin-left: auto; }
/* 선생님: 모둠 판 보기 · 나란히 · 합쳐 보기 · 제출본 */
.gp-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.gp-top .rc-line .rc-btn.small { margin-left: 0; }
.gp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; }
.gp-card { display: grid; gap: 6px; align-content: start; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 8px; }
.gp-card.picked { box-shadow: 0 0 0 4px var(--accent); }
.gp-ch { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-height: 1.4em; }
.gp-ch b { font: 800 19px/1.2 var(--f-display); }
.gp-names { font-size: 13px; color: var(--ink-2); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gp-sub { font: 700 12px/1 var(--f-body); color: #fff; background: #1f7a3f; border-radius: 999px; padding: 4px 8px; }
.gp-picked { font: 700 12px/1 var(--f-body); color: var(--paper-2); background: var(--accent); border-radius: 999px; padding: 4px 8px; }
.gp-thumb { display: block; width: 100%; padding: 0; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--paper-2); cursor: zoom-in; overflow: hidden; }
.gp-thumb:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
.gp-svg { display: block; width: 100%; height: auto; pointer-events: none; }
.gp-html { position: relative; width: 100%; overflow: hidden; pointer-events: none; }
.gp-memo { margin: 0; min-height: 1.2em; font: 400 21px/1.15 var(--f-pen); color: var(--ink); overflow-wrap: anywhere; }
.gp-act { display: flex; gap: 6px; }
.gp-act .rc-btn.small { margin-left: 0; flex: 1 1 0; }
.gp-order { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 700 14px var(--f-body); color: var(--ink-2); }
.gp-ord { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.gp-o { font: 700 13px/1 var(--f-body); padding: 6px 10px; border: 1.5px solid var(--accent); border-radius: 999px; background: var(--accent-soft); color: var(--ink); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.gp-o i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--paper-2); font-size: 11px; }
.gp-o.out { border-style: dashed; border-color: var(--rule); background: transparent; color: var(--ink-3); }
.room-card.full { width: min(1800px, 100%); }
.gp-cmp { display: grid; gap: 14px; }
.gp-cmp.n2 { grid-template-columns: 1fr 1fr; }
.gp-cmp.n3 { grid-template-columns: repeat(3, 1fr); }
.gp-cmp.n4 { grid-template-columns: 1fr 1fr; }

.gp-big { border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--paper-2); }

.gp-cmp.n4 .gp-big .gp-svg { max-height: 32vh; }
.gp-agg { overflow: auto; }
.gp-agg table { border-collapse: collapse; width: 100%; font-size: 16px; }
.gp-agg th, .gp-agg td { border: 1.5px solid var(--rule); padding: 6px 10px; text-align: left; }

@media (max-width: 760px) { .gp-cmp.n2, .gp-cmp.n3, .gp-cmp.n4 { grid-template-columns: 1fr; } .grp-bar { max-width: calc(100vw - 24px); } }
@media print { .grp-bar, .grp-ptr, .grp-shield { display: none !important; } }

/* ===================== 개념 다지기 조각(concept.js) ===================== */
@keyframes c-shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.cb { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cb-lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.cb-line { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 16px; font-size: 25px; line-height: 2.1; transition: border-color .3s, box-shadow .3s; }
.cb-line.done { border-color: var(--induced); box-shadow: inset 8px 0 0 var(--induced); }
.cb-lab { display: inline-block; font: 800 22px/1.2 var(--f-display); color: var(--accent); margin-right: 10px; }
.cb-blank { display: inline-block; min-width: 4.6em; min-height: 1.55em; padding: 0 12px; margin: 0 4px; line-height: 1.5; text-align: center; border: 2.5px dashed var(--ink-3); border-radius: 10px; background: var(--paper); color: var(--ink); vertical-align: middle; cursor: pointer; transition: border-color .2s, background .2s, box-shadow .2s; }
.cb-blank:empty::before { content: "?"; color: var(--ink-3); font-weight: 700; }
.cb-blank.on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); font-weight: 800; cursor: default; }
.cb-blank.target { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 4px var(--hl); }
.cb-blank:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
.cb-blank.bad, .cb-word.bad, .pr-in.bad { animation: c-shake .45s ease; }
.cb-frac { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; gap: 4px; margin: 0 6px; line-height: 1.5; }
.cb-frac .cb-blank { margin: 0; }
.cb-bar { display: block; height: 3px; background: var(--ink); border-radius: 2px; }
.cb-words { display: flex; flex-wrap: wrap; gap: 10px; min-height: 52px; }
.cb-word { font: 700 22px/1 var(--f-body); color: var(--ink); padding: 12px 18px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-2); box-shadow: 0 4px 0 var(--ink); cursor: grab; touch-action: none; user-select: none; position: relative; z-index: 2; }
.cb-word.drag { cursor: grabbing; box-shadow: 0 10px 18px rgba(29, 36, 51, .3); z-index: 5; }
.cb-word[aria-pressed="true"] { outline: 4px solid var(--hl); outline-offset: 2px; }
.cb-word.used { display: none; }
.cb-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cb-msg { font: 400 30px/1.15 var(--f-pen); margin: 0; min-height: 1.15em; color: var(--ink); flex: 1 1 auto; min-width: 0; }

.pr { position: relative; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; transition: border-color .3s, box-shadow .3s; }
.pr.goal { border-color: var(--induced); box-shadow: 0 0 0 5px color-mix(in srgb, var(--induced) 35%, transparent); }
.pr-head { display: flex; align-items: center; gap: 12px; }
.pr-kind { font: 700 19px var(--f-body); letter-spacing: .1em; color: var(--accent); margin-right: auto; }
.pr-streak { font: 400 32px var(--f-pen); color: var(--induced); }
.pr-head .btn { font-size: 19px; padding: 9px 16px; }
.pr-q { font-size: 26px; line-height: 1.5; }
.pr-q b { font-variant-numeric: tabular-nums; }
.pr-fig { display: block; width: 100%; height: auto; }
.pr-ans { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pr-ans label { display: inline-flex; align-items: baseline; gap: 8px; font: 700 24px var(--f-body); }
.pr-in { width: 170px; font: 800 32px var(--f-display); padding: 6px 12px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.pr-in:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
.pr-in.ok { border-color: var(--induced); background: #e3f1e8; }
.pr-in.no { border-color: var(--stamp); background: #fbe4df; }
.pr-steps { margin: 0; padding-left: 28px; display: flex; flex-direction: column; gap: 4px; font-size: 22px; line-height: 1.45; }
.pr-steps li { visibility: hidden; }
.pr-steps li.on { visibility: visible; }
.pr-msg { font: 400 29px/1.15 var(--f-pen); margin: 0; min-height: 1.15em; }
.pr.locked > :not(.pr-lock) { opacity: .25; pointer-events: none; }
.pr-lock { display: none; }
.pr.locked .pr-lock { display: grid; position: absolute; inset: 0; place-items: center; text-align: center; font: 400 36px/1.2 var(--f-pen); color: var(--ink); padding: 20px; }

.cl { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cl-claim { border: 3px solid var(--stamp); border-radius: 10px; background: var(--paper-2); padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.cl-claim .tag { grid-column: 1 / -1; font-size: 19px; letter-spacing: .12em; font-weight: 700; color: var(--stamp); }
.cl-claim p { font: 700 26px/1.35 var(--f-display); }
.cl-claim .btn { font-size: 20px; padding: 11px 16px; }
.cl-fig { display: block; width: 100%; height: auto; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; }
.cl-q { font: 700 22px var(--f-body); }
.cl-opts { grid-template-columns: 1fr; gap: 8px; }
.cl-opts button { text-align: left; font-size: 21px; padding: 11px 16px; line-height: 1.35; }
.cl-opts button.right { background: var(--induced); border-color: var(--induced); color: var(--paper-2); }
.cl-opts button.wrong { background: var(--stamp); border-color: var(--stamp); color: var(--paper-2); }
.cl-msg { font-size: 21px; line-height: 1.45; min-height: 2.9em; margin: 0; }
/* 화학식 첨자: reveal 초기화가 sub·sup을 없애서 되살린다(2026-10-30, 1-2-2에서 옮김) */
.reveal sub, .reveal sup { font-size: .68em; line-height: 0; position: relative; vertical-align: baseline; }
.reveal sup { top: -.5em; }
.reveal sub { bottom: -.25em; }
/* 선생님 화면 도구 막대의 «의견» 단추(게시판으로) */
.toolbar .tool-board { text-decoration: none; }

/* 높이가 낮은 화면(휴대폰 가로 등): 장 번호·넘김 단추가 슬라이드 아래 내용을 덮지 않게 작게 모서리로 (2026-10-30) */
@media (max-height: 560px) {
  .reveal .slide-number { font-size: 12px; bottom: 4px; right: 70px; padding: 2px 4px; }
  .reveal .controls { transform: scale(.6); transform-origin: right bottom; bottom: 2px; right: 2px; }
}
/* 한 줄짜리 본문 격자: 글이 늘어나도 줄 높이가 장 밖으로 커지지 않게(넘치면 core.js 맞춤이 단을 줄인다) — 2026-10-31 */
.body.sim, #lab .body, #flap .body, #field .body, #inquiry .body, #wrap .body { grid-template-rows: minmax(0, 1fr); }

/* ===================== 빠른 퀴즈(quiz.js) ===================== */
/* 선생님: 화면 아래 퀴즈 줄(시작·끝내기·다시 하기·순위 공개) */
.qz-bar {
  position: fixed; z-index: 58; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; width: max-content; max-width: calc(100vw - 150px);
  font: 500 15px/1.3 var(--f-body); color: var(--ink); background: var(--paper-2); border: 2px solid #d9631e; border-radius: 18px; padding: 6px 10px 6px 16px;
  box-shadow: 3px 3px 0 #d9631e;
}
.qz-bar[hidden] { display: none; }
.qz-bar b { font-weight: 800; }
.qz-bar .qb-lbl { font-size: 13px; color: var(--ink-3); margin-left: 4px; }
.qz-bar .qb-seg button { min-height: 34px; font-size: 14px; padding: 0 12px; }
@media (max-height: 560px) {
  .qz-bar { bottom: 4px; max-width: calc(100vw - 120px); font-size: 13px; padding: 3px 6px 3px 12px; gap: 4px 6px; border-radius: 14px; box-shadow: 2px 2px 0 #d9631e; }
  .qz-bar .gb-btn { min-height: 30px; padding: 0 10px; font-size: 13px; }
  .qz-bar .qb-seg button { min-height: 28px; font-size: 12px; padding: 0 8px; }
  .qz-bar .qb-lbl { display: none; }
}
@media (max-width: 760px) { .qz-bar { max-width: calc(100vw - 24px); } }

/* 선생님(프로젝터): 장 위 통계 판. 장 좌표(1920×1080) 안에 있어 화면 크기와 상관없이 같은 모양 */
.reveal .slides section > .qz-board {
  position: absolute; inset: 84px 110px 100px 128px; z-index: 60; display: flex; flex-direction: column; gap: 22px;
  background: var(--paper-2); border: 3px solid var(--ink); border-radius: 22px; padding: 26px 36px; box-shadow: 8px 8px 0 rgba(29, 36, 51, .18);
  font-family: var(--f-body); color: var(--ink); text-align: left; overflow: hidden;
}
.reveal .slides section > .qz-board[hidden] { display: none; }
.qz-head { display: flex; align-items: baseline; gap: 22px; flex: none; }
.qz-head > b { font: 800 44px var(--f-display); color: #d9631e; }
.qz-head > span { font: 700 34px var(--f-body); color: var(--ink-2); }
.qz-head .qz-clock { font: 800 40px var(--f-mono); color: var(--ink); background: #fff6e6; border: 2px solid #d9631e; border-radius: 999px; padding: 2px 22px; }
.qz-head .qz-clock.hot { color: var(--stamp); }
.qz-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; flex: none; }
.qz-kpi { background: #fff; border: 2px solid var(--ink); border-radius: 16px; padding: 12px 18px; display: flex; flex-direction: column; gap: 2px; }
.qz-kpi b { font: 800 64px/1.05 var(--f-mono); color: var(--ink); }
.qz-kpi span { font: 700 24px var(--f-body); color: var(--ink-2); }
.qz-kpi small { font-size: 20px; color: var(--ink-3); }
.qz-kpi.acc b { color: var(--accent); }
.qz-main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1.55fr 1fr; gap: 26px; }
.qz-main h3, .qz-rev h3 { margin: 0 0 10px; font: 800 30px var(--f-body); color: var(--ink); }
.qz-main h3 small { font: 600 22px var(--f-body); color: var(--ink-3); margin-left: 8px; }
.qz-items, .qz-rank { min-height: 0; overflow: hidden; }
.qz-items ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.qz-items li { display: grid; grid-template-columns: minmax(0, 1fr) 240px 92px 70px; align-items: center; gap: 14px; font: 600 25px/1.25 var(--f-body); }
.qz-items .qz-lb { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.qz-lb b { font-weight: 800; color: var(--accent); }
.qz-items .qz-meter i { display: block; height: 100%; border-radius: 999px; background: #2f9e5b; }
.qz-items .qz-meter { height: 22px; border-radius: 999px; background: var(--grid); overflow: hidden; }
.qz-items li.mid .qz-meter i { background: #e0a21a; }
.qz-items li.low .qz-meter i { background: var(--stamp); }
.qz-items li > b { font: 800 32px var(--f-mono); text-align: right; }
.qz-items li.low > b { color: var(--stamp); }
.qz-items li > small { font: 600 20px var(--f-mono); color: var(--ink-3); }
.qz-more, .qz-empty, .qz-note { margin: 10px 0 0; font: 600 22px var(--f-body); color: var(--ink-3); }
.qz-rank ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.qz-rank li { display: grid; grid-template-columns: 56px 1fr auto 34px; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 14px; font: 700 32px var(--f-body); }
.qz-rank li:first-child { background: #fff6d6; border-color: #d9a21a; }
.qz-rank li > b { font: 800 34px var(--f-mono); }
.qz-rank li > small { font-size: 24px; color: var(--ink-3); text-align: center; }

.qz-who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 학생: 게임 위 덮개(기다려요 · 3·2·1 · 다 했어요 · 결과). 게임 자리 안에서 장 좌표로 그린다 */
.qz-cover { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 18px; border-radius: inherit;
  background: color-mix(in srgb, var(--paper-2) 90%, transparent); text-align: center; font-family: var(--f-body); color: var(--ink); touch-action: none; overflow: auto; }

.qz-c .qz-big { font: 800 50px/1.3 var(--f-display); color: var(--ink); }
.qz-c .qz-small { font: 600 26px/1.4 var(--f-body); color: var(--ink-2); }
.qz-c .qz-num { font: 800 240px/1 var(--f-mono); color: #d9631e; }

/* 많이 틀린 카드(학생 결과·선생님 돌아보기) */

.qz-miss li i { position: absolute; left: 0; bottom: 0; height: 8px; width: var(--w); background: var(--stamp); }
.qz-miss .qz-rk { background: var(--stamp); }
.qz-miss .qz-lb { font: 800 32px/1.3 var(--f-body); }

.qz-miss .qz-rt small { font: 600 20px var(--f-body); color: var(--ink-3); }

/* 선생님 돌아보기: 크게 */

/* 지난 판 결과 */

@media print { .qz-bar, .qz-board, .qz-cover { display: none !important; } }

/* ---------- 의견판(wall.js, 2026-11-18): 장 안 선생님 판(1920×1080 기준) · 학생 휴대폰 덮개(.wl-m) · 크게(.wl-focus) ----------
   판 바탕·글씨·단추 색은 장 색 변수(--paper·--grid·--ink·--accent·--stamp·--hl)를 따르고, 카드만 포스트잇 색(칸마다 하나: --wl-h 칸 머리 · --wl-c 카드 · --wl-i 칸 글씨 · --wl-m 카드 아래 글씨) */
.reveal .slides section.wl-sec > .wl {
  position: absolute; inset: 0; z-index: 1; box-sizing: border-box; padding: 74px 72px 84px 128px;   /* 위는 수업방 배지(오른쪽 위 고정), 아래는 장 번호·넘김 화살표 자리 */ display: flex; flex-direction: column; gap: 20px;
  background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 37px 37px;
  font-family: var(--f-body); color: var(--ink); text-align: left; --wl-fs: 26px;
}
.wl button { font-family: inherit; cursor: pointer; }
.wl button:focus-visible, .wl-m button:focus-visible, .wl-m textarea:focus-visible, .wl-focus button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wl [hidden] { display: none !important; }
.wl-head { display: flex; align-items: center; gap: 26px; }
.wl-brand { display: flex; align-items: center; gap: 13px; flex-shrink: 0; }
.wl-logo { width: 44px; height: 44px; border-radius: 12px; background: var(--hl); border: 4px solid var(--ink); box-sizing: border-box; }
.wl-brand span, .wl-pen { font-family: var(--f-pen); font-size: 40px; line-height: 1; }
.reveal .wl-q { flex: 1 1 auto; margin: 0; font: 800 44px/1.22 var(--f-display); letter-spacing: -.5px; }
.wl-meta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.wl-pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 999px; font: 600 21px var(--f-body); white-space: nowrap; }
.wl-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #2f9e6b; }

.wl-btn { height: 58px; padding: 0 21px; border: 1px solid var(--rule); background: var(--paper-2); border-radius: 16px; font: 600 20px var(--f-body); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.wl-btn.icon { width: 58px; padding: 0; }
.wl-btn svg { width: 28px; height: 28px; }
.wl-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
/* 쓰기 도구 줄 */
.wl-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; }
.wl-chip { height: 52px; padding: 0 20px; border: 1.5px solid var(--rule); background: var(--paper-2); border-radius: 999px; font: 600 20px var(--f-body); color: var(--ink); display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.wl-chip svg { width: 22px; height: 22px; }
.wl-chip.shut { background: var(--ink); border-color: var(--ink); color: #fff; }
.wl-chip.pre { border: 2.5px solid var(--accent); color: var(--accent); font-weight: 700; }
.wl-chip.x { width: 52px; padding: 0; justify-content: center; }
.wl-timebox { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 14px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 999px; }

.wl-timebox .wl-chip { height: 46px; border-color: transparent; background: transparent; }

.wl-left { padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--hl); font: 700 22px var(--f-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wl-waitbox { display: inline-flex; align-items: center; gap: 12px; padding: 4px 4px 4px 16px; background: var(--paper-2); border: 2px dashed #9aa6a4; border-radius: 999px; font: 700 20px var(--f-body); color: #3d4452; }
.wl-waitbox svg { width: 22px; height: 22px; }
.wl-ok { height: 48px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: 700 19px var(--f-body); }
.wl-gather { display: inline-flex; align-items: center; gap: 6px; padding: 6px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 18px; margin-left: auto; }
.wl-gather > span { padding: 0 8px 0 10px; font: 700 19px var(--f-body); color: #3d4452; }
.wl-gather button { height: 48px; padding: 0 18px; border: 0; border-radius: 13px; background: transparent; color: var(--ink); font: 600 19px var(--f-body); }
.wl-gather button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
/* 칸·카드 */
.wl-cols { flex: 1 1 auto; min-height: 0; display: grid; gap: 28px; }
.wl-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
.wl-colhead { display: flex; align-items: center; gap: 12px; padding: 12px 21px; background: var(--wl-h); border-radius: 18px; }
.reveal .wl-colhead h3 { margin: 0; flex: 1 1 auto; font: 700 27px var(--f-body); color: var(--ink); }
.wl-colhead > span { font: 600 20px var(--f-body); color: var(--wl-i); }
.wl-colhead .wl-pg { padding-left: 10px; border-left: 2px solid rgba(29, 36, 51, .2); }
.wl-nav { width: 52px; height: 52px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .6); color: var(--ink); display: grid; place-items: center; }

.wl-cards { flex: 0 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 6px 8px 0; margin: -6px -8px 0; scrollbar-width: thin; }
.wl-list { display: flex; flex-direction: column; gap: 16px; padding-bottom: 52px; }
.wl-wall .wl-list, .wl-one .wl-list { display: block; columns: 4 340px; column-gap: 24px; }

.wl-card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px 21px 13px; background: var(--wl-c); border-radius: 21px; box-shadow: 0 1px 0 rgba(29, 36, 51, .06), 0 8px 18px rgba(29, 36, 51, .08); }

.wl-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 500 calc(var(--wl-fs) * .74) var(--f-body); color: var(--wl-m); }
.wl-likes { display: inline-flex; align-items: center; gap: 6px; color: var(--stamp); font-weight: 700; }
.wl-likes svg { width: 1.15em; height: 1.15em; }
.wl-hit { position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: transparent; border-radius: inherit; }
.wl-card .wl-acts, .wl-card .wl-tb, .wl-card .wl-flag { position: relative; z-index: 2; }
.wl-card.sel { outline: 4px solid var(--accent); outline-offset: 3px; box-shadow: 0 12px 30px rgba(29, 36, 51, .18); z-index: 3; }
.wl-card.focused { outline: 4px dashed var(--accent); outline-offset: 3px; }
.wl-card.wait, .wl-card.hid { background: rgba(255, 255, 255, .72); border: 3px dashed #9aa6a4; box-shadow: none; }
.wl-card.wait .wl-text { color: #3d4452; }
.wl-card.hid { opacity: .6; }
.wl-flag { display: flex; align-items: center; gap: 10px; font: 700 17px var(--f-body); color: #59625f; }
.wl-flag svg { width: 20px; height: 20px; }
.wl-acts { display: flex; gap: 10px; }
.wl-acts button { height: 58px; border-radius: 13px; font: 700 20px var(--f-body); }
.wl-acts .wl-ok { flex: 1 1 auto; border-radius: 13px; }
.wl-sub { padding: 0 21px; border: 1px solid var(--rule); background: var(--paper-2); color: var(--ink); font-weight: 600 !important; }
.wl-acts .wl-sub:only-child { flex: 1 1 auto; }
.wl-tb { position: absolute !important; top: -38px; right: 13px; display: flex; gap: 5px; padding: 5px; background: var(--ink); border-radius: 16px; box-shadow: 0 8px 20px rgba(29, 36, 51, .25); }
.wl-list > .wl-card:first-child .wl-tb { top: auto; bottom: -38px; }
.wl-tb > button { height: 58px; min-width: 58px; border: 0; border-radius: 12px; background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.wl-tb > button svg { width: 24px; height: 24px; }
.wl-tb .wl-tb-big { padding: 0 18px; background: var(--hl); color: var(--ink); font: 700 19px var(--f-body); }
.wl-pop { position: absolute; top: 72px; right: 0; min-width: 280px; padding: 12px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 12px 28px rgba(29, 36, 51, .2); font: 500 18px var(--f-body); color: var(--ink); }
.wl-pop p { margin: 0 0 10px; color: var(--ink-2); }
.wl-pop button { width: 100%; height: 52px; border: 0; border-radius: 10px; background: var(--paper); color: var(--ink); font: 600 18px var(--f-body); }
.wl-rest { flex-shrink: 0; height: 56px; border: 2px dashed currentColor; border-radius: 16px; background: transparent; color: var(--wl-i); font: 600 20px var(--f-body); }
.wl-note { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); margin: 0; padding: 12px 28px; border-radius: 999px; background: var(--ink); color: #fff; font: 600 22px var(--f-body); white-space: nowrap; }
/* 설정 더보기 */
.wl-menu { position: absolute; z-index: 6; top: 150px; right: 72px; width: 480px; display: flex; flex-direction: column; gap: 4px; padding: 12px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 20px; box-shadow: 0 18px 40px rgba(29, 36, 51, .22); }

.wl-menu-row button { height: 46px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper-2); color: var(--ink); font: 600 17px var(--f-body); }

.wl-menu .wl-danger { color: var(--stamp); }
.wl-menu .wl-danger[data-armed] { background: var(--stamp); color: #fff; }
/* 빈 판: 질문을 크게 + 참여 인원 + 참여 코드·QR */
.wl-hero { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; gap: 90px; padding: 20px 40px 20px 20px; }
.wl-hero-main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 34px; min-width: 0; }
.wl-tag { align-self: flex-start; padding: 8px 22px; background: var(--hl); border-radius: 999px; font: 40px/1.1 var(--f-pen); }
.reveal .wl-hq { margin: 0; font: 800 80px/1.22 var(--f-display); letter-spacing: -1px; }
.wl-hcols { display: flex; flex-wrap: wrap; gap: 16px; }

.wl-join { width: 470px; flex-shrink: 0; box-sizing: border-box; padding: 40px; background: var(--paper-2); border-radius: 36px; box-shadow: 0 2px 0 rgba(29, 36, 51, .05), 0 24px 54px rgba(29, 36, 51, .12); display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; font: 400 24px/1.45 var(--f-body); color: var(--ink-2); }

.wl-bigcode { padding: 12px 32px; border-radius: 20px; background: var(--ink); color: #fff; font: 700 66px/1.1 var(--f-body); letter-spacing: 12px; }
.wl-meta-e { position: absolute; top: 74px; right: 72px; z-index: 2; }

.wl-new { animation: wl-drop .2s cubic-bezier(.2, .8, .3, 1.15) both; }

/* 크게: 모든 화면에 그 카드(그 자리에서 커진다) */
.wl-focus { position: fixed; inset: 0; z-index: 66; word-break: keep-all; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; background: rgba(29, 36, 51, .62); }

.wl-fcard { box-sizing: border-box; width: min(92vw, 1100px); max-height: 76vh; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding: clamp(20px, 3vw, 48px); background: var(--wl-c); border-radius: 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); color: var(--ink); font-family: var(--f-body); }

.wl-fclose { height: 56px; padding: 0 30px; border: 0; border-radius: 999px; background: var(--paper-2); color: var(--ink); font: 700 18px var(--f-body); cursor: pointer; }

/* 학생 휴대폰 화면 */
.wl-m { position: fixed; inset: 0; z-index: 55; display: flex; flex-direction: column; box-sizing: border-box; background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; font-family: var(--f-body); color: var(--ink); text-align: left; word-break: keep-all; }
.wl-m[hidden], .wl-m [hidden], .wl-m-pill[hidden], .wl-toast[hidden] { display: none !important; }
.wl-m button { font-family: inherit; cursor: pointer; }
.wl-m-head { display: flex; flex-direction: column; gap: 10px; padding: calc(max(12px, env(safe-area-inset-top, 0px)) + 48px) 18px 12px; background: rgba(242, 245, 243, .94); border-bottom: 1px solid var(--rule); }
.wl-m-top { display: flex; align-items: center; gap: 10px; }

.wl-m-time svg { width: 16px; height: 16px; }
.wl-m-min { width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper-2); color: var(--ink); }

/* 의견판 1-나(2026-11-18): 묶음(«비슷한 카드 +n», 겹친 그림자) · 끌어 옮기기 · 지난 판 · 내보내기(인쇄용 화면 A4 가로) · 이름 자유 판의 이름 칸 */
.wl-card.stack { margin-bottom: 14px; box-shadow: 0 8px 0 -3px color-mix(in srgb, var(--wl-c) 45%, var(--wl-h)), 0 16px 0 -7px var(--wl-h), 0 20px 24px rgba(29, 36, 51, .12); }
.wl-grp { display: flex; flex-direction: column; gap: 10px; }
.wl-list > .wl-grp:first-child { padding-top: 12px; }   /* 맨 위 묶음의 «비슷한 카드 +n»이 칸 위끝에 잘리지 않게 */
.wl-wall .wl-grp, .wl-one .wl-grp { break-inside: avoid; margin-bottom: 18px; }
.wl-wall .wl-grp > .wl-card, .wl-one .wl-grp > .wl-card { margin-bottom: 12px; }
.wl-list > .wl-grp:first-child > .wl-card .wl-tb { top: auto; bottom: -38px; }
.wl-stack { position: absolute; top: -15px; right: 16px; z-index: 2; height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 700 17px var(--f-body); box-shadow: 0 4px 10px rgba(29, 36, 51, .22); }
.wl-stack[aria-expanded="true"] { background: var(--accent); }
.wl-kids { display: flex; flex-direction: column; gap: 10px; margin: 0 0 6px 26px; padding-left: 16px; border-left: 3px dashed var(--wl-h); }

.reveal .wl-kid .wl-text { font-size: calc(var(--wl-fs) * .86); }
.wl-card .wl-out { position: relative; z-index: 2; align-self: flex-start; height: 46px; border-radius: 12px; font: 600 17px var(--f-body) !important; }
.wl-hit { cursor: grab; }
.wl-card.wl-lift { opacity: .32; }
.wl-card.wl-hold { outline: 4px solid var(--hl); outline-offset: 3px; }
.wl-card.wl-drop { outline: 5px solid var(--accent); outline-offset: 4px; box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 16%, transparent); }
.wl-col { border-radius: 22px; transition: background-color .12s; }
.wl-col.wl-dropcol { background: color-mix(in srgb, var(--wl-h) 38%, transparent); outline: 3px dashed var(--wl-i); outline-offset: 6px; }
.wl-dragging, .wl-dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.wl-ghost { position: fixed !important; z-index: 80; margin: 0 !important; box-sizing: border-box; pointer-events: none; transform-origin: 0 0; box-shadow: 0 26px 54px rgba(29, 36, 51, .32) !important; opacity: .97; }
.wl-ghost[data-hint]:not([data-hint=""])::after { content: attr(data-hint); position: absolute; left: 50%; bottom: -54px; transform: translateX(-50%); padding: 8px 18px; border-radius: 999px; background: var(--ink); color: #fff; font: 700 20px var(--f-body); white-space: nowrap; }
.wl-pop-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 8px; }

/* 판 위에 띄우는 것: 지난 판 목록 · 지난 판 다시 띄우기(읽기 전용) */

.wl-lbox { width: 1120px; max-height: 100%; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 28px 32px 32px; background: var(--paper-2); border-radius: 28px; box-shadow: 0 30px 70px rgba(29, 36, 51, .3); }

.wl-plist button:hover { border-color: var(--accent); }
.wl-pmeta { display: flex; align-items: center; gap: 10px; font: 600 19px var(--f-body); color: var(--ink-2); }
.wl-pmeta i { font-style: normal; padding: 2px 12px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; }
.wl-plist b { font: 700 27px/1.3 var(--f-body); }
.wl-ptitle { font: 500 18px var(--f-body); color: var(--ink-3); }

.wl-layer.wl-seen { flex-direction: column; justify-content: flex-start; align-items: stretch; gap: 20px; padding: 74px 72px 84px 128px; background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 37px 37px; }
.wl-ro { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--hl); font: 700 20px var(--f-body); white-space: nowrap; }

/* 인쇄용 화면: 장 밖에 따로 띄우고, 인쇄하면 이것만(A4 가로) */
.wl-print { position: fixed; inset: 0; z-index: 90; overflow: auto; background: #e6e9ec; color: #1d2433; font-family: var(--f-body); word-break: keep-all; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.wl-pbar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #c3cecd; font-size: 15px; }

.wl-pc { break-inside: avoid; padding: 3mm 4mm; border-radius: 3mm; background: var(--wl-c); border: .3mm solid rgba(29, 36, 51, .14); }
.wl-pc.stack { border-left: 1.4mm solid var(--wl-h); }
.wl-pc p { margin: 0 0 1.8mm; font-size: 11pt; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
.wl-pc footer { display: flex; justify-content: space-between; gap: 3mm; font-size: 9pt; color: var(--wl-m); }
.wl-pc footer b { color: #c8402f; }
.wl-pc ul { margin: 2mm 0 0; padding-left: 4.5mm; font-size: 9.5pt; line-height: 1.4; }

@media print {

/* 학생 휴대폰: 묶음 · 이름 자유 판의 이름 칸 */
.wl-sc.stack { margin-bottom: 8px; box-shadow: 0 5px 0 -2px color-mix(in srgb, var(--wl-c) 55%, var(--wl-h)), 0 10px 0 -4px var(--wl-h), 0 12px 16px rgba(29, 36, 51, .1); }
.wl-mstack { align-self: flex-start; height: 40px; margin: -2px 0 0; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 700 13px var(--f-body); }
.wl-mstack[aria-expanded="true"] { background-color: var(--accent); }
.wl-sc-kids { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; margin: -2px 0 4px 16px; padding-left: 12px; border-left: 3px dashed var(--rule); }

/* ===================== 학생 발표 · 주목 → 활동 시작(present.js) ===================== */
/* 의견판과 같은 말투: 흰 알약·옅은 테두리·칠판 초록 단추·노란 강조. 단추는 손가락 44px 이상 */
.pr-bar, .pr-sbar {
  position: fixed; z-index: 59; left: 50%; transform: translateX(-50%);
  bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + var(--pr-lift, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; width: max-content; max-width: calc(100vw - 150px);
  font: 600 16px/1.3 var(--f-body); color: var(--ink); word-break: keep-all;
}
.pr-bar { background: var(--paper-2); border: 1.5px solid var(--rule); border-radius: 999px; padding: 6px 6px 6px 18px; box-shadow: 0 6px 18px rgba(29, 36, 51, .10); }
.pr-bar.pres { border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.pr-bar.act { border-color: var(--accent); box-shadow: 0 6px 18px rgba(31, 95, 74, .18); }
.pr-bar.bare { background: none; border: 0; box-shadow: none; padding: 0; }
.pr-bar.bare .pr-btn { box-shadow: 0 6px 18px rgba(29, 36, 51, .10); }
.pr-bar[hidden], .pr-sbar[hidden], .pr-timer[hidden], .pr-toast[hidden], .pr-call[hidden], .pr-ptr[hidden] { display: none !important; }
.pr-who { display: inline-flex; align-items: center; gap: 8px; font-size: 17px; white-space: nowrap; }
.pr-who b { font-weight: 800; }
.pr-meta { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.pr-meta svg { width: 18px; height: 18px; }
.pr-meta.low, .pr-left.low { color: var(--stamp); }
.pr-wait { color: var(--stamp); font-weight: 800; }
.pr-away { color: #8a5a00; background: #fff3c4; border-radius: 999px; padding: 4px 10px; }
.pr-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--stamp); box-shadow: 0 0 0 0 rgba(200, 64, 47, .5); animation: pr-air 1.6s ease-out infinite; flex: none; }
.pr-who.act .pr-dot { background: var(--accent); animation-name: pr-air-g; }
@keyframes pr-air { 0% { box-shadow: 0 0 0 0 rgba(200, 64, 47, .55); } 100% { box-shadow: 0 0 0 10px rgba(200, 64, 47, 0); } }
@keyframes pr-air-g { 0% { box-shadow: 0 0 0 0 rgba(31, 95, 74, .5); } 100% { box-shadow: 0 0 0 10px rgba(31, 95, 74, 0); } }
.pr-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; border: 2px solid var(--accent); border-radius: 999px; background: var(--accent); color: #fff; font: 700 16px/1 var(--f-body); cursor: pointer; white-space: nowrap; }
.pr-btn svg { width: 20px; height: 20px; flex: none; }
.pr-btn b { font-weight: 800; }
.pr-btn.quiet { background: var(--paper-2); color: var(--ink); border: 1.5px solid var(--rule); }
.pr-btn.quiet b { color: var(--accent); }

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

        var modules = new Array(moduleCount);

          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);

      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }

      for (var i = 0; i < rsBlocks.length; i += 1) {

      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      }

    M.body.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const id = Number((b.closest('.wl-sc') || {}).dataset?.id);
      if (b.dataset.a === 'like') {
        const want = !S.liked.has(id);
        if (want && S.left === 0) { toast(`공감을 다 썼어요(${S.conf.likes}개) · 하나를 취소하면 다시 쓸 수 있어요`); return; }
        R.send({ t: 'wlike', id, on: want });
        if (want) S.liked.add(id); else S.liked.delete(id);      // 바로 보이게(방의 wme가 바로잡는다)
        b.classList.remove('pop'); void b.offsetWidth; if (want && !reduce) b.classList.add('pop');
        b.setAttribute('aria-pressed', String(want));
      } else if (b.dataset.a === 'edit') openSheet(id);
      else if (b.dataset.a === 'mstack') { if (S.open.has(id)) S.open.delete(id); else S.open.add(id); paint(); }
    });
    M.body.addEventListener('scroll', () => { if (M.body.scrollTop < 30 && S.newN) { S.newN = 0; M.news.hidden = true; } }, { passive: true });
    M.news.onclick = () => { M.body.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); S.newN = 0; M.news.hidden = true; };
    return M;
  }
  function chipsDraw() {
    const cols = colsOf(cur() || {});
    M.root.querySelector('.wl-m-cols').hidden = !cols.length || !!M.edit;
    M.chips.innerHTML = cols.map((c, i) => `<button type="button" data-col="${i}" aria-pressed="${M.col === i}" style="${tint(PAL[i % PAL.length])}">${esc(c)}</button>`).join('');
  }
  function openSheet(editId) {
    const m = phone(), c = editId ? S.cards.get(editId) : null;
    if (!writable()) { toast('쓰기가 닫혔어요'); return; }
    m.edit = c ? c.id : null;
    const d = store.get().d, cols = colsOf(cur() || {});
    m.col = c ? c.col : d && Number.isInteger(d.col) ? d.col : store.col(S.sid);
    if (m.col >= cols.length) m.col = 0;
    m.ta.value = c ? c.text : (d && d.text) || '';
    m.cnt.textContent = `${m.ta.value.length} / ${MAX}`; m.err.textContent = '';
    const del = m.root.querySelector('.wl-m-del'); del.hidden = !c; delete del.dataset.armed; del.textContent = '지우기';
    m.root.querySelector('.wl-m-go').textContent = c ? '고치기' : '붙이기';
    m.form.setAttribute('aria-label', c ? '내 카드 고치기' : '내 생각 붙이기');
    const free = !!(S.conf && S.conf.free) && !c;
    m.root.querySelector('.wl-m-namebox').hidden = !free;
    if (free && !m.name.value) m.name.value = myName();
    chipsDraw();
    m.sheet.hidden = false;
    setTimeout(() => m.ta.focus(), reduce ? 0 : 60);
  }
  function closeSheet() { if (!M) return; M.sheet.hidden = true; M.edit = null; M.add.focus({ preventScroll: true }); }
  function drawPhone() {
    const B = cur(), show = !teacher() && !!B && live(B);
    if (!show) { if (M) { M.root.hidden = true; M.pill.hidden = true; } return; }
    const m = phone(), cols = colsOf(B), conf = S.conf || {};
    m.root.hidden = S.min; m.pill.hidden = !S.min;
    m.root.querySelector('.wl-m-q').textContent = conf.q || B.cfg.q;
    m.root.querySelector('.wl-m-who').textContent = conf.free ? (myName() ? `${myName()} · 참여 중` : '이름을 적고 참여해요') : R.who ? R.who() : '';
    const mine = [...S.cards.values()].filter((c) => c.mine), others = [...S.cards.values()].filter((c) => !c.mine && c.state === 'live');
    m.root.querySelector('.wl-m-likes').textContent = S.left != null && !S.lock && others.length ? `공감 ${S.left}개 남음` : '';
    paintClock();
    const tag = (c) => (cols.length ? `<span class="wl-coln">${esc(cols[Math.min(cols.length - 1, c.col)])}</span>` : '');
    const state = (c) => (c.state === 'wait' ? ' · 선생님 확인 중' : c.state === 'hid' ? ' · 선생님이 숨겼어요' : '');
    const kindWall = !cols.length;
    const mineHtml = sorted(mine).map((c) => `<article class="wl-sc mine ${c.state}${S.fresh.has(c.id) && !reduce ? ' wl-new' : ''}" data-id="${c.id}" style="${tint(palOf(c, kindWall))}"><span class="wl-mtag">내 카드${cols.length ? ' · ' + esc(cols[Math.min(cols.length - 1, c.col)]) : ''}${state(c)}</span><p>${esc(c.text)}</p><div class="wl-sc-foot"><span class="wl-sc-likes">공감 ${c.likes}</span>${writable() && c.state !== 'hid' ? `<button type="button" class="wl-sc-edit" data-a="edit" aria-label="내 카드 고치기">고치기</button>` : ''}</div></article>`).join('');
    let body;
    if (S.lock) {
      body = `<div class="wl-m-lock">${I.lock}<p>내 생각을 먼저 붙이면<br>친구들 카드가 열려요.</p></div><div class="wl-m-skel" aria-hidden="true">${[0, 1, 2].map((i) => `<div style="${tint(PAL[i])}"><span style="width:${[82, 74, 88][i]}%"></span><span style="width:${[56, 64, 40][i]}%"></span></div>`).join('')}</div>
        <p class="wl-m-count">${S.n ? `벌써 카드 ${S.n}장이 붙었어요` : '아직 아무도 안 붙였어요 · 첫 카드가 되어 보세요'}</p>`;
    } else {
      const { tops, kids } = stacks(others);
      const one = (c, k, kid) => {
        const liked = S.liked.has(c.id), open = k.length && S.open.has(c.id);
        return `<article class="wl-sc${kid ? ' kid' : ''}${k.length ? ' stack' : ''}${S.fresh.has(c.id) && !reduce ? ' wl-new' : ''}" data-id="${c.id}" style="${tint(palOf(c, kindWall))}">${kid ? '' : tag(c)}${k.length ? `<button type="button" class="wl-mstack" data-a="mstack" aria-expanded="${!!open}">비슷한 카드 +${k.length}</button>` : ''}<p>${esc(c.text)}</p><div class="wl-sc-foot"><span class="wl-who">${esc(k.length ? stackWho(c, k) : c.label)}</span><button type="button" class="wl-heart" data-a="like" aria-pressed="${liked}" aria-label="공감하기, 지금 ${c.likes}"${S.left === 0 && !liked ? ' aria-disabled="true"' : ''}>${I.heart(liked)}<span>${c.likes}</span></button></div></article>`
          + (open ? `<div class="wl-sc-kids" role="group" aria-label="비슷한 카드">${k.map((x) => one(x, [], true)).join('')}</div>` : '');
      };
      const list = sorted(tops).map((c) => one(c, kids.get(c.id) || [], false)).join('');
      body = mineHtml + list + (!mine.length && !others.length ? `<p class="wl-m-count">아직 카드가 없어요 · 첫 카드가 되어 보세요</p>` : '');
    }
    if (S.lock && mineHtml) body = mineHtml + body;
    const closedNote = !writable() ? `<div class="wl-m-closed">${I.lock}<p>${timeLeft() === 0 || conf.timeup ? '쓰기 시간이 끝났어요' : '선생님이 쓰기를 닫았어요'}</p></div>` : '';
    m.body.innerHTML = closedNote + body;
    const full = mine.length >= MINE;
    m.add.disabled = !writable() || full;
    m.add.querySelector('span').textContent = !writable() ? '쓰기가 닫혔어요' : full ? `${MINE}장을 다 붙였어요` : '내 생각 붙이기';
    if (!writable() && !m.sheet.hidden && !m.edit) { m.err.textContent = '쓰기가 닫혔어요 · 쓴 글은 이 기기에 남아 있어요'; }
    if (S.newN && m.body.scrollTop > 30) { m.news.hidden = false; m.news.textContent = `새 카드 ${S.newN}장 ↑`; } else { S.newN = 0; m.news.hidden = true; }   // 맨 위를 보고 있으면 알림 없이 바로 보인다
  }
  // 쓰기 시간: 남은 시간 막대와 칩(선생님은 쓰기 도구 줄의 «남음»)
  let clockT = 0;
  function paintClock() {
    const tl = timeLeft();
    if (M) {
      const t = M.root.querySelector('.wl-m-time'), bar = M.root.querySelector('.wl-m-bar');
      t.hidden = tl === null; bar.hidden = tl === null;
      if (tl !== null) { t.innerHTML = `${I.clock}${mmss(tl)} 남음`; bar.firstElementChild.style.width = `${S.conf.dur ? Math.max(0, Math.min(100, (tl / S.conf.dur) * 100)) : 0}%`; }
    }
    if (teacher()) document.querySelectorAll('.wl-sec.present .wl-left').forEach((b) => { b.textContent = `${mmss(tl || 0)} 남음`; });
  }
  function tick() {
    clearTimeout(clockT);
    const tl = timeLeft();
    if (tl === null) return;
    paintClock();
    if (tl <= 0) { paint(); return; }                               // 이 기기 시계로 끝: 붙이기를 막는다(방이 닫힘을 보낸다)
    clockT = setTimeout(tick, Math.min(500, tl));
  }
  let toastT = 0;
  function toast(t) {
    if (R && R.flash && teacher()) { R.flash(t); return; }
    let b = document.querySelector('.wl-toast');
    if (!b) { b = h('div', 'wl-toast'); b.setAttribute('role', 'status'); document.body.appendChild(b); }
    b.textContent = t; b.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { b.hidden = true; }, 2600);
  }

  // ---------- 장 넘김 ----------
  function slideChanged(e) {
    if (teacher() && on()) {
      const prev = e && e.previousSlide ? walls.get(e.previousSlide.dataset.wallId) : null, now0 = cur();
      if (prev && prev !== now0 && S.sid === prev.sid) wset({ leave: true });
      if (now0) enter(now0);
    }
    S.min = false; S.menu = false;
    paint();
  }
  function start() {
    scan();
    if (!walls.size) return;
    Reveal.on('slidechanged', slideChanged);
    Reveal.on('resize', () => { const B = cur(); if (B) fit(B); });
    paint();
  }
  const ready = () => (window.Reveal && Reveal.isReady && Reveal.isReady() ? start() : setTimeout(ready, 120));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready); else ready();

  // ---------- 수업방과 잇기(room.js가 부른다) ----------
  window.Wall = {
    get list() { return [...walls.keys()]; },
    _bind(bridge) { R = bridge; scan(); paint(); },
    _unbind() { R = null; clear(); paint(); },
    _reset() { clear(); paint(); },
    _msg: onMsg,
    _state(m) { if (!m.wall) { if (S.key) clear(); } else onMsg(m.wall); if (teacher()) enter(cur()); paint(); },
    _here() { if (teacher()) enter(cur()); },                          // 반 방 선생님이 수업을 (다시) 시작했다
    _refresh: () => paint(),
    // 편집기가 장의 data-wall을 고쳤다: 질문·칸·설정을 다시 읽어 그린다(없던 장이면 새로 찾는다)
    _rescan(sec) {
      const B = sec && walls.get(sec.dataset.wallId);
      if (!B) { scan(); paint(); return; }
      B.cfg = parseCfg(sec); B.root.setAttribute('aria-label', '의견판: ' + B.cfg.q);
      paint();
    },
  };
})();
</script>
<script>
// 방과 잇기: 방 정보(GET /rooms/:code)로 판을 그리고, 웹소켓 메시지를 wall.js에 넘긴다
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const API = (qs.get('roomapi') || 'https://science-room.pang99x.workers.dev').replace(/\/$/, '');
  const code = (qs.get('room') || '').trim();
  const pass = qs.get('roomapi') ? '&roomapi=' + encodeURIComponent(qs.get('roomapi')) : '';
  const msg = document.querySelector('.wlp-msg'), endBox = document.querySelector('.wlp-end');
  let ws = null, live = false, students = 0, retry = 0, ping = 0, closed = false;
  const say = (t) => { msg.textContent = t || ''; msg.hidden = !t; };
  const end = (t) => { closed = true; try { ws && ws.close(); } catch { /* 이미 닫힘 */ } endBox.querySelector('b').textContent = t; endBox.hidden = false; say(''); };
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const mine = (read('science-room:classes') || []).find((r) => r && r.code === code && r.key);
  const ROLE = mine && qs.get('as') !== 'student' ? 'teacher' : 'student';
  document.documentElement.dataset.role = ROLE;
  // 학생 기기 표시(room.js와 같은 것): 다시 연결해도 같은 참가자로 센다. 이름·기기 정보와는 상관없는 임의 글자
  const CID = (() => {
    try { let c = localStorage.getItem('science-room:cid'); if (!c) { c = 's-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('science-room:cid', c); } return c; }
    catch { return 's-' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
  })();
  if (!/^\d{6}$/.test(code)) { end('참여 코드(여섯 자리)가 없어요'); return; }
  if (!/^https?:\/\//.test(API)) { end('수업방에 연결할 수 없어요'); return; }
  const bridge = {
    role: ROLE,
    send: (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); },
    active: () => live,
    code: () => code,
    link: () => location.href.split(/[?#]/)[0] + '?room=' + code,
    students: () => students,
    who: () => '이름 없이 참여 중',
  };
  function connect() {
    const q = ROLE === 'teacher' ? '&key=' + encodeURIComponent(mine.key) : '&cid=' + CID;
    try { ws = new WebSocket(`${API.replace(/^http/, 'ws')}/rooms/${code}/ws?role=${ROLE}${q}&hb=1`); } catch { return; }
    ws.onopen = () => { live = true; retry = 0; say(''); clearInterval(ping); ping = setInterval(() => { try { ws.send('ping'); } catch { /* 끊김: onclose가 다시 잇는다 */ } }, 25000); };
    ws.onmessage = (e) => {
      if (e.data === 'pong') return;
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === 'state') { students = m.students || 0; window.Wall._state(m); return; }
      if (m.t === 'count') { students = m.students || 0; window.Wall._refresh(); return; }
      if (m.t === 'closed') { end('의견판이 닫혔어요'); return; }
      window.Wall._msg(m);
    };
    ws.onclose = (e) => {
      live = false; clearInterval(ping);
      if (closed) return;
      if (e.code === 4404) { end('의견판이 닫혔어요'); return; }
      window.Wall._refresh();
      retry++; say('다시 연결하는 중…');
      setTimeout(() => { if (!closed) fetch(`${API}/rooms/${code}`).then((r) => r.json()).then((i) => (i.open ? connect() : end('의견판이 닫혔어요')), connect); }, Math.min(10000, 700 * retry));
    };
  }
  say('의견판을 여는 중…');
  fetch(`${API}/rooms/${code}`).then((r) => r.json()).then((info) => {
    if (!info.open) { end('열려 있지 않은 의견판이에요'); return; }
    if (!info.wall) { location.replace(`join.html?room=${code}${pass}`); return; }   // 반 방 코드면 반 링크로
    const w = info.wall;
    document.getElementById('board').dataset.wall = JSON.stringify({ q: w.q, cols: w.cols, blind: w.blind, likes: w.likes, approve: w.approve, time: w.time });
    document.title = `${w.q} · 의견판`;
    window.Reveal._ready = true;
    window.Wall._bind(bridge);
    connect();
  }, () => say('연결하지 못했어요. 인터넷 연결을 확인해 주세요.'));
})();
</script>
